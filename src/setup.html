<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上手向导 · lark-cc-router</title>
<style>
:root{
  /* 暖色纸面 + 陶土色强调，跟 Claude 应用一个调子。两页一字不差 */
  --bg:#F5F4EE; --surface:#FBFAF7; --sunk:#EFEDE5; --sel:#E8E5DA;
  --ink:#262624; --ink-2:#5F5D57; --ink-3:#86847C;
  --line:#E6E3D9; --rule:#D5D1C5; --accent:#C15F3C; --accent-w:#F5E6DE; --accent-bg:#C15F3C;
  --run:#94660F; --run-w:#F5EBD3; --ok:#3B7046; --ok-w:#E4EEE2; --bad:#B0302A; --bad-w:#F8E3DF;
  --skip:#6E6C65; --skip-w:#ECEAE2; --think:#6E5BAE;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei","Helvetica Neue",sans-serif;
  /* 标题和 Claude 的回答用衬线（Claude 应用也是这么分的）。Windows 没宋体好字，中文退回雅黑而不是 SimSun */
  --serif:"Iowan Old Style","Charter",Georgia,"Songti SC","Source Han Serif SC","Noto Serif CJK SC","Microsoft YaHei",serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --rs:8px; --sh:0 1px 3px rgba(38,38,36,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1F1E1C; --surface:#262624; --sunk:#1A1917; --sel:#34332F;
  --ink:#EEECE6; --ink-2:#B7B4AA; --ink-3:#8B887F;
  --line:#353430; --rule:#4A4843; --accent:#DB8361; --accent-w:#3B2A22; --accent-bg:#B9583A;
  --run:#E2B460; --run-w:#30281A; --ok:#82C493; --ok-w:#1F2C22; --bad:#F2857A; --bad-w:#3A221F;
  --skip:#A3A097; --skip-w:#2F2E2B; --think:#B7A9EC;
  --sh:0 1px 3px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
/*
 * 类名约定同 page.html：没有通用单词的裸类名（踩过三次）。块名前缀：
 * wz- 整页 / sx- 段 / ck- 检查项 / ws- 工作区 / qr- 扫码；状态修饰一律 is-* / s-*，只当修饰用。
 */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--accent-w);color:var(--accent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rs);
  padding:5px 12px;color:var(--ink);transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
button:hover{background:var(--sunk);border-color:var(--ink-3)}
button:active{background:var(--sunk)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff;filter:brightness(.93)}
dialog.ask{border:0;border-radius:14px;padding:18px;width:min(420px,calc(100vw - 32px));background:var(--bg);color:var(--ink);
  box-shadow:0 12px 44px rgba(31,30,28,.22)}
dialog.ask::backdrop{background:rgba(31,30,28,.4)}
dialog.ask p{margin:0 0 16px;line-height:1.6}
dialog.ask form>div{display:flex;justify-content:flex-end;gap:8px}
button.ghost{background:none;border-color:transparent;color:var(--ink-2);padding:4px 7px}
button.ghost:hover{background:var(--sunk);color:var(--ink)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
/* 慢操作进行中：按钮里转个圈，比灰掉更像「在干活」 */
button.is-busy{opacity:.75;cursor:progress}
button.is-busy::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px;
  border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:wz-spin .8s linear infinite}
@keyframes wz-spin{to{transform:rotate(360deg)}}
input{background:var(--surface);border:1px solid var(--rule);border-radius:var(--rs);padding:5px 10px;width:100%;min-width:0;height:34px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-w)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 顶栏（同 page.html） ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font:500 17px/1 var(--serif);letter-spacing:-.005em}
.brand b{color:var(--accent);font-weight:400;margin:0 1px}
.wz-crumb{color:var(--ink-2);font-size:13px;padding-left:14px;border-left:1px solid var(--line)}
.conn{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-w)}
.wz-sp{flex:1}
.wz-stat{font-size:12.5px;color:var(--ink-2)}

/* ---------- 正文 ---------- */
.wz-main{max-width:820px;margin:0 auto;padding:48px 24px 90px}
.embed .topbar,.embed .wz-intro{display:none!important}   /* is-ready 那块自己带 display:flex */
.embed body{background:var(--surface)}
.embed .wz-main{margin:0;padding:8px 40px 40px}
.only #secs{margin-top:0}
.only .sx{border:none;background:none;box-shadow:none}
.only .sx>summary{display:none}
.only .sx-body{padding:0}
/* 配好了的飞书应用 / 登录：收成一个按钮，不要灰底面板 */
.wz-form.is-min{background:none;border:none;padding:0;margin-top:8px}
.wz-intro h1{margin:0;font:400 32px/1.25 var(--serif);letter-spacing:-.01em}
.wz-intro p{margin:12px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.7;max-width:40rem}
.wz-intro.is-ready{background:var(--ok-w);border:1px solid transparent;border-radius:var(--r);padding:22px 24px;
  display:flex;align-items:center;gap:20px}
.wz-intro.is-ready h1{color:var(--ok)}
.wz-intro.is-ready button{flex:none;padding:8px 18px;font-size:14px}
#secs{margin-top:28px}

/* 段：一张可折叠的卡片 */
.sx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-top:12px}
.sx.is-cur{border-color:var(--rule);box-shadow:0 4px 16px rgba(38,38,36,.07)}
.sx>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px;user-select:none}
.sx>summary::-webkit-details-marker{display:none}
/* 折叠箭头用边框画：▸ 字符在 11px 下只剩一个点 */
.sx>summary::after{content:"";width:7px;height:7px;margin:0 3px 3px 4px;border-right:1.5px solid var(--ink-3);
  border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
.sx[open]>summary::after{transform:rotate(45deg)}
.sx-num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule)}
.sx.is-cur .sx-num{background:var(--accent-bg);border-color:var(--accent-bg);color:#fff}
.sx.is-ok .sx-num{background:var(--ok-w);border-color:var(--ok-w);color:var(--ok)}
.sx-title{font:500 18px/1.3 var(--serif)}
.sx-sum{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.sx.is-cur .sx-sum{color:var(--accent);font-weight:600}
.sx.is-ok .sx-sum{color:var(--ok)}
.sx .sx-sum.is-bad{color:var(--bad)}
.sx-body{padding:0 22px 20px 56px}
.sx-desc{margin:-4px 0 10px;color:var(--ink-2);font-size:13px}

/* 检查项：图标 | 名字 + 说明 | 按钮 */
.ck{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:12px;align-items:start;
  padding:11px 0;border-top:1px solid var(--line)}
.ck-i{width:18px;height:18px;margin-top:1px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;line-height:1}
.ck-i.s-ok{background:var(--ok-w);color:var(--ok)}
.ck-i.s-missing{border:1.5px dashed var(--ink-3)}
.ck-i.s-error{background:var(--bad-w);color:var(--bad)}
.ck-i.s-running{border:2px solid var(--line);border-top-color:var(--run);animation:wz-spin .9s linear infinite}
.ck-lb{font-weight:500;line-height:20px}
.ck-opt{margin-left:8px;font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;
  background:var(--skip-w);color:var(--skip);vertical-align:1px}
.ck-dt{color:var(--ink-3);font-size:12.5px;margin-top:1px;word-break:break-word}
.ck>button{margin-top:-4px}
.ck-more{grid-column:2/-1;min-width:0}

/* 提示（每个按钮一条，key 跟按钮一样） */
.wz-msg{font-size:12.5px;margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.wz-msg:empty{display:none}
.wz-msg.is-bad{color:var(--bad)}
.wz-msg.is-ok{color:var(--ok)}
.wz-msg.is-info{color:var(--ink-2)}

/* 表单 */
.wz-form{margin-top:10px;padding:14px 16px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);
  display:grid;gap:12px}
.wz-fi{display:flex;flex-direction:column;gap:5px;min-width:0}
.wz-lb{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.wz-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.wz-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px}
.wz-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wz-hint{margin:0;color:var(--ink-3);font-size:12.5px;line-height:1.55}
.wz-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.wz-inline input{flex:1 1 13rem;width:auto}
.wz-inline input.is-short{flex:0 1 10rem}
.wz-link{font-size:12.5px;white-space:nowrap}
.api-list{display:grid;gap:10px}
.api-list:empty{display:none}
.api{display:grid;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs)}
.api-h{display:flex;align-items:center;gap:6px}
.api-h input{flex:1 1 auto;min-width:0;font-weight:600}
.api-no{font-size:12px;font-weight:700;color:var(--ink-3);width:1.2em;text-align:center}
.api-kind{font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.api-tok{display:flex;gap:6px}
.api-tok input{flex:1;min-width:0}

/* 扫码 */
.qr-box{display:flex;gap:18px;align-items:center}
.qr-box img{width:172px;height:172px;flex:none;background:#fff;padding:8px;border-radius:var(--rs);border:1px solid var(--line);
  image-rendering:pixelated}
.qr-box img.is-expired{opacity:.25}
.qr-t{font:500 17px/1.35 var(--serif);margin-bottom:6px}
.qr-left{margin-top:10px;font-size:12.5px;color:var(--run)}

/* 进度日志 */
.sx-log{margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--rs);padding:8px 11px;
  font:12px/1.65 var(--mono);color:var(--ink-2);max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.sx-log:empty{display:none}
.sx-log .is-ok{color:var(--ok)}
.sx-log .is-bad{color:var(--bad)}

/* 工作区 */
.ws-h{margin:20px 0 8px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;display:flex;gap:10px;align-items:baseline;white-space:nowrap}
.ws-h small{font:11.5px var(--mono);font-weight:400;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-rec{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.ws-rec+.wz-msg+.ws-rec,.ws-rec+.ws-rec{margin-top:8px}
.ws-rec>div{flex:1;min-width:0}
.ws-done{color:var(--ok);font-size:12.5px;font-weight:600;white-space:nowrap}
.ws-card{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-top:8px}
.ws-card.is-use{border-color:var(--accent)}
.ws-head{display:flex;align-items:center;gap:8px}
.ws-name{font-weight:600;flex:none}
.ws-badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--accent-w);color:var(--accent);flex:none}
.ws-path{font:11.5px var(--mono);color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-head button{padding:3px 9px;font-size:12.5px}
.ws-repos{margin-top:8px}
.ws-repos>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);width:fit-content}
.ws-repos>summary:hover{color:var(--accent)}
.ws-list{margin-top:6px;max-height:300px;overflow:auto}
.ws-repo{display:grid;grid-template-columns:minmax(0,1fr) auto 9.5rem auto;gap:2px 12px;align-items:center;
  padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
.ws-repo>b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-date{font:11.5px var(--mono);color:var(--ink-3);text-align:right}
.ws-err{grid-column:1/-1;color:var(--bad);font-size:12px;word-break:break-word}
.ws-repo button{padding:1px 7px;font-size:12px}
.ws-pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px}
.ws-pill.s-ok{background:var(--ok-w);color:var(--ok)}
.ws-pill.s-stale{background:var(--run-w);color:var(--run)}
.ws-pill.s-missing{background:var(--skip-w);color:var(--skip)}
.ws-pill.s-error{background:var(--bad-w);color:var(--bad)}
.ws-other{margin-top:16px}
.ws-other>summary{cursor:pointer;font-size:13px;color:var(--ink-2);width:fit-content}
.ws-other>summary:hover{color:var(--accent)}
.ws-other .wz-lb{display:block;margin-top:14px}
.ws-panel .wz-acts{margin-top:14px}

@media(max-width:760px){
  .sx-body{padding-left:20px}
  .wz-g2,.wz-g3{grid-template-columns:1fr}
  .ws-repo{grid-template-columns:minmax(0,1fr) auto auto}
  .ws-date{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">lark<b>·</b>cc<b>·</b>router</span>
  <span class="wz-crumb">上手向导</span>
  <span class="conn"><span id="dot" class="dot"></span><span id="conn-t">连接中…</span></span>
  <span class="wz-sp"></span>
  <span id="wz-stat" class="wz-stat"></span>
  <button id="skip" class="ghost" onclick="location.href='/'">跳过，先进主界面</button>
  <button id="go" class="primary" onclick="location.href='/'" hidden>全部就绪 · 进入主界面</button>
</header>

<main class="wz-main">
  <section class="wz-intro" id="intro-todo">
    <h1>第一次用，把下面几步配好</h1>
    <p>从上往下，每一步按提示点按钮就行，配好的会自动打勾。暂时配不了的可以先「跳过」，以后从主界面右上角的「上手向导」回来接着配。</p>
  </section>
  <section class="wz-intro is-ready" id="intro-ready" hidden>
    <div>
      <h1>全部就绪</h1>
      <p>以后有人在飞书里 @你，这台电脑上的 Claude 会去排查，并以你的名义回复。让这个应用一直开着就行。</p>
    </div>
    <button class="primary" onclick="location.href='/'">进入主界面</button>
  </section>
  <div id="secs"></div>
</main>

<script>
'use strict';
// 嵌在设置页里：不要顶栏和开场白，左边距对齐设置页。only=段 id：设置里单独的「API」「飞书」页，只要那一段、一直展开
const Q = new URLSearchParams(location.search);
const ONLY = Q.get('only');
if (Q.has('embed')) document.documentElement.classList.add('embed');
if (ONLY) document.documentElement.classList.add('only');
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

/** 后端只给段标题；这一步是干嘛的、点哪里，得跟产品同学说清楚 */
const DESC = {
  tools: '检查飞书命令行、git 和当前模板使用的执行器。',
  model: 'Codex 连接已有的 App Server。模型和推理强度在「设置 → Codex」中选择。',
  lark: '让它能用你的飞书身份看群消息、回消息。先确定用哪个飞书应用，再用飞书 App 扫码登录。',
  workspace: '选择执行器排查问题时使用的项目目录。',
  plugin: '查日志、查数据库这类「现场取证」工具。先安装，再给需要登录的工具授权一次。',
};
const ICON = { ok: '✓', missing: '', error: '!', running: '' };
const REPO_ST = { ok: '最新', stale: '不是最新', missing: '没拉下来', error: '出错' };
const OPENED = '已经在浏览器里打开了授权页：登录并同意，完成后这里会自动打勾。';
const OPENED_TERM = '已经打开了一个终端窗口，接着会弹出浏览器：在浏览器里登录并同意，完成后这里会自动打勾（终端窗口可以关）。';

let st = null;              // GET /api/setup/status
let preset = null;          // GET /api/setup/preset
let wsList = null;          // GET /api/setup/workspace/list
let wsEls = null;           // 工作区段里那块面板（推荐 / 列表），loadWs 往里画
const cards = new Map();    // 段 id → <details>
const userOpen = new Map(); // 用户手动开合过的段：以后按他的来，不再自动开合
const extras = new Map();   // '段/检查项' → 挂在它下面的表单。缓存着：刷新状态不能把输入框里的字冲掉
const addForms = new Map(); // 工作区名 → 「加仓库」那行，理由同上
const reposOpen = new Map();// 工作区名 → 仓库列表展没展开
const pending = new Map();  // 按钮 key → 段 id：进行中的操作，按钮转圈、不能重复点
const msgs = new Map();     // 提示 key → { text, kind }
const logs = new Map();     // 段 id → 进度行

/* ---------- 接口 ---------- */
/** 后端抛错是 500 { error }，业务失败是 { ok: false, error }：都变成 throw，调用处显示出来 */
async function call(route, body) {
  let r;
  try {
    r = await fetch(route, body === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
  } catch { throw new Error('连不上本机服务。应用还开着吗？'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.ok === false) throw new Error(d.error || `出错了（HTTP ${r.status}）`);
  return d;
}
const get = (route) => call(route);

/* ---------- 提示 / 忙碌：按 key 找元素，行重画了也接得上 ---------- */
function msgBox(key) { const n = el('div', 'wz-msg'); n.dataset.msg = key; paintMsg(n); return n; }
function paintMsg(n) {
  const m = msgs.get(n.dataset.msg);
  n.textContent = m?.text || '';
  n.className = 'wz-msg' + (m ? ' is-' + m.kind : '');
  if (m?.link) { const a = el('a', null, m.link.text); a.href = m.link.href; a.target = '_blank'; a.rel = 'noopener'; n.append(' ', a); }
}
function setMsg(key, text, kind, link) {
  if (text) msgs.set(key, { text, kind, link }); else msgs.delete(key);
  for (const n of document.querySelectorAll('[data-msg]')) if (n.dataset.msg === key) paintMsg(n);
}
function syncBusy() {
  for (const b of document.querySelectorAll('button[data-key]')) {
    const on = pending.has(b.dataset.key);
    if (on !== b.classList.contains('is-busy')) { b.classList.toggle('is-busy', on); b.disabled = on; }
  }
}
/** 二次确认用 <dialog>，不用 confirm()：浏览器掐过一次弹框之后 confirm() 直接当「取消」，按钮就点不动了（同 page.html 的 ask） */
function ask(msg, yes = '确定') {
  const d = el('dialog', 'ask'), f = el('form'), row = el('div');
  const no = el('button', 'ghost', '取消'), ok = el('button', 'primary', yes);
  f.method = 'dialog'; no.value = ''; ok.value = 'ok';
  row.append(no, ok); f.append(el('p', null, msg), row); d.append(f);
  document.body.append(d);
  d.showModal(); ok.focus();
  return new Promise((r) => d.addEventListener('close', () => { d.remove(); r(d.returnValue === 'ok'); }));
}
function btn(label, cls, key) { const b = el('button', cls, label); b.type = 'button'; if (key) b.dataset.key = key; return b; }
function inp(ph, type) { const i = el('input'); i.placeholder = ph || ''; if (type) i.type = type; i.spellcheck = false; i.autocomplete = 'off'; return i; }
function field(label, input) { const f = el('label', 'wz-fi'); f.append(el('span', 'wz-lb', label), input); return f; }
function link(href, text) { const a = el('a', 'wz-link', text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.hidden = !href; return a; }
function row(cls, ...kids) { const n = el('div', cls); n.append(...kids); return n; }

/**
 * 点按钮 → POST。按钮转圈到有结果；慢操作（{ started }）一直转到 SSE 推 done。
 * 出错写进跟按钮同 key 的提示里，不吞。then 不给时：{ opened } 提示去终端里授权，其余成功就刷新。
 */
async function act(b, sid, route, body, then) {
  const key = b.dataset.key;
  setMsg(key, '');
  pending.set(key, sid); syncBusy();
  let started = false;
  try {
    const d = await call(route, body ?? {});
    started = !!d.started;
    if (started) log(sid, `开始${b.textContent}…`);
    if (then) await then(d);
    else if (d.opened) {
      // 授权在后台等着，状态马上变成「等你授权」；完成后后端推 done，这里自动刷新打勾
      setMsg(key, d.terminal ? OPENED_TERM : OPENED, 'info', d.url && { text: '浏览器没弹出来？点这里打开', href: d.url });
      await reload(sid);
    }
    else if (d.ok === false) setMsg(key, d.error, 'bad');
    else if (!started) await reload(sid);
  } catch (e) { setMsg(key, e.message, 'bad'); }
  if (!started) pending.delete(key);
  syncBusy();
}
async function reload(sid) { await refresh(); if (sid === 'workspace') await loadWs(); }

/* ---------- 状态 ---------- */
let poll = 0;
async function refresh() {
  try { st = await get('/api/setup/status'); setMsg('status', ''); }
  catch (e) { setMsg('status', '读不到配置状态：' + e.message, 'bad'); return; }
  render();
  clearTimeout(poll);
  // 有检测还在后台跑（比如查插件授权要好几秒），过一会儿再看
  if (st.sections.some((s) => s.checks.some((c) => c.state === 'running'))) poll = setTimeout(refresh, 2500);
}

const left = (s) => s.checks.filter((c) => !c.optional && c.state !== 'ok');

function render() {
  const secs = ONLY ? st.sections.filter((s) => s.id === ONLY) : st.sections;
  const cur = secs.find((s) => left(s).length);
  const done = secs.filter((s) => !left(s).length).length;
  $('wz-stat').textContent = st.ready ? '' : `已完成 ${done} / ${secs.length} 步`;
  $('go').hidden = !st.ready; $('skip').hidden = !!st.ready;
  $('intro-todo').hidden = !!st.ready; $('intro-ready').hidden = !st.ready;

  const box = $('secs');
  for (const [id, d] of cards) if (!secs.some((s) => s.id === id)) d.remove();
  secs.forEach((s, i) => {
    const d = cards.get(s.id) || buildCard(s.id);
    if (box.children[i] !== d) box.insertBefore(d, box.children[i] || null);
    paintCard(d, s, i, s === cur);
  });
  syncBusy();
}

function buildCard(id) {
  const d = el('details', 'sx');
  const sum = el('summary');
  sum.append(el('span', 'sx-num'), el('span', 'sx-title'), el('span', 'sx-sum'));
  sum.onclick = () => userOpen.set(id, !d.open);
  const body = el('div', 'sx-body');
  body.append(el('p', 'sx-desc', DESC[id] || ''), el('div', 'sx-checks'));
  const more = id === 'workspace' ? wsPanel() : id === 'plugin' ? pluginPanel() : null;
  if (more) body.append(more);
  const lg = el('div', 'sx-log');
  for (const l of logs.get(id) || []) lg.append(logLine(l));
  body.append(lg);
  d.append(sum, body);
  cards.set(id, d);
  return d;
}

function paintCard(d, s, i, isCur) {
  const need = left(s);
  const ok = !need.length;
  d.className = 'sx' + (ok ? ' is-ok' : '') + (isCur ? ' is-cur' : '');
  d.querySelector('.sx-num').textContent = ok ? '✓' : i + 1;
  d.querySelector('.sx-title').textContent = s.title;
  const sum = d.querySelector('.sx-sum');
  sum.textContent = ok ? '已就绪' : need.some((c) => c.state === 'running') ? '检测中…' : `还差 ${need.length} 项`;
  sum.classList.toggle('is-bad', need.some((c) => c.state === 'error'));
  d.open = ONLY ? true : userOpen.get(s.id) ?? isCur;
  // 段没变就不重画：轮询时别的段在填的输入框不该丢焦点
  const json = JSON.stringify(s);
  if (d._json === json) return;
  d._json = json;
  d.querySelector('.sx-checks').replaceChildren(...s.checks.map((c) => checkRow(s, c)));
  // 授权提示只在真有要授权的工具时出现
  const ph = d.querySelector('.pl-hint');
  if (ph) ph.hidden = !s.checks.some((c) => c.action?.route === '/api/setup/mcp/login');
}

function checkRow(s, c) {
  const r = el('div', 'ck');
  r.append(el('span', 'ck-i s-' + c.state, ICON[c.state] ?? ''));
  const txt = el('div');
  const lb = el('div', 'ck-lb', c.label);
  if (c.optional) lb.append(el('span', 'ck-opt', '可选'));
  txt.append(lb);
  if (c.detail) txt.append(el('div', 'ck-dt', c.detail));
  r.append(txt);
  const extra = extraFor(s.id, c);
  // 有专门表单的检查项，表单代替后端给的按钮
  if (c.action && !extra) {
    const b = btn(c.action.label, c.state === 'missing' || c.state === 'error' ? 'primary' : null, c.action.route + JSON.stringify(c.action.body ?? {}));
    b.onclick = () => act(b, s.id, c.action.route, c.action.body);
    r.append(b);
    txt.append(msgBox(b.dataset.key));
  } else r.append(el('span'));
  if (extra) { extra.upd?.(c, s); r.append(extra); }
  return r;
}

/* ---------- 检查项下面的表单 ---------- */
function extraFor(sid, c) {
  const k = sid + '/' + c.id;
  if (!extras.has(k)) {
    const make = sid === 'workspace' && c.id.startsWith('git-token:') ? () => gitTokenForm(c.id.slice(10))
      : { 'model/gateway': modelForm, 'lark/app': larkAppForm, 'lark/login': larkLoginForm }[k];
    extras.set(k, make ? make() : null);
  }
  return extras.get(k);
}

/**
 * API 来源表：按顺序用，第一个出问题（额度用完、限流、令牌失效）自动换下一个接着跑。
 * 令牌页面上拿不到原值：留空 = 不改，「清掉」才清。改了名的靠 from 认回原来那条（令牌、模板的固定都跟着走）
 */
function modelForm() {
  const f = el('div', 'ck-more wz-form');
  const list = el('div', 'api-list');
  const addGw = btn('+ 网关', 'ghost'), addSub = btn('+ Claude 订阅', 'ghost');
  const save = btn('保存', 'primary', 'apis');
  let rows = [];
  const draw = () => list.replaceChildren(...rows.map(apiRow));
  const move = (i, d) => { [rows[i], rows[i + d]] = [rows[i + d], rows[i]]; draw(); };

  function apiRow(a, i) {
    const box = el('div', 'api');
    const name = inp('名字'); name.value = a.name; name.oninput = () => { a.name = name.value; };
    const up = btn('↑', 'ghost'), down = btn('↓', 'ghost'), del = btn('删掉', 'ghost danger');
    up.disabled = i === 0; down.disabled = i === rows.length - 1;
    up.onclick = () => move(i, -1); down.onclick = () => move(i, 1);
    del.onclick = () => { rows.splice(i, 1); draw(); };
    box.append(row('api-h', el('span', 'api-no', String(i + 1)), name,
      el('span', 'api-kind', a.kind === 'subscription' ? 'Claude 订阅' : '网关'), up, down, del));

    const sub = a.kind === 'subscription';
    if (!sub) { const url = inp('http://…'); url.value = a.baseUrl || ''; url.oninput = () => { a.baseUrl = url.value; }; box.append(field('地址', url)); }
    const tok = inp('', 'password'), clr = btn('清掉', 'ghost');
    const ph = () => {
      tok.placeholder = a.token === '' ? '保存后清掉' : a.hasToken ? '已保存，留空不改'
        : sub ? '不填 = 用 claude 自己登录的账号' : '网关给你的令牌';
      clr.hidden = !a.hasToken || a.token === '';
    };
    tok.oninput = () => { if (tok.value) a.token = tok.value; else delete a.token; ph(); };
    clr.onclick = () => { a.token = ''; tok.value = ''; ph(); };
    ph();
    box.append(field('令牌', row('api-tok', tok, clr)));
    // 模板只选档位，这里说每一档在这个来源上叫什么（交给 claude 的 ANTHROPIC_DEFAULT_*_MODEL）
    const models = a.models || (a.models = {});
    box.append(row('wz-g3', ...[['opus', '强'], ['sonnet', '中'], ['haiku', '快 · 判定也用']].map(([k, cn]) => {
      const m = inp('不填 = 原名'); m.value = models[k] || ''; m.setAttribute('aria-label', a.name + ' 的 ' + k + ' 档模型名');
      m.oninput = () => { models[k] = m.value.trim(); };
      return field(k + ' · ' + cn, m);
    })));
    box.append(el('p', 'wz-hint', sub ? '订阅直接认 opus / sonnet / haiku，一般不用填。'
      : '每一档在这个网关上叫什么。只认一个名字的网关（比如 claude-auto）三格都填它；官方 API 不用填。'));
    if (sub) box.append(el('p', 'wz-hint', '桌面版要填令牌（它的 claude 配置是单独的）：终端里跑 claude setup-token，用订阅账号登录，把给出的令牌贴进来。命令行版不填就用本机 Claude Code 登录的账号。'));

    const test = btn('测一下', null, 'api-test-' + i);
    test.onclick = () => act(test, 'model', '/api/setup/apis/test', a, (d) => {
      const r = d.result;
      setMsg(test.dataset.key, (r.ok ? '✓ ' : '✗ ') + r.detail + (r.ms ? '（' + r.ms + 'ms）' : ''), r.ok ? 'ok' : 'bad');
    });
    box.append(row('wz-acts', test), msgBox(test.dataset.key));
    return box;
  }

  const load = async () => {
    const d = await get('/api/setup/model').catch(() => ({ apis: [] }));
    rows = (d.apis || []).map((a) => ({ ...a, models: { ...a.models }, from: a.name }));
    // 一个都没有：团队预置了网关就先摆一条出来，填个令牌就能用。预置的是一个模型名：三档都叫它
    const pm = preset.gateway.model;
    if (!rows.length && preset.gateway.baseUrl) rows.push({ name: '网关', kind: 'gateway', baseUrl: preset.gateway.baseUrl, models: pm ? { opus: pm, sonnet: pm, haiku: pm } : {} });
    draw();
  };
  addGw.onclick = () => { rows.push({ name: '网关 ' + (rows.length + 1), kind: 'gateway', baseUrl: '', models: {} }); draw(); };
  addSub.onclick = () => { rows.push({ name: 'Claude 订阅', kind: 'subscription', models: {} }); draw(); };
  save.onclick = () => act(save, 'model', '/api/setup/apis', { apis: rows.map(({ hasToken, ...r }) => r) }, async () => {
    setMsg('apis', '✓ 已保存', 'ok');
    await Promise.all([load(), refresh()]);
  });

  f.append(el('p', 'wz-hint', '按顺序用：第一个出问题（额度用完、限流、令牌失效）自动换下一个接着跑。某个模板要固定用其中一个，到 设置 → 模板 里选。'),
    list, row('wz-acts', addGw, addSub), row('wz-acts', save, link(preset.gateway.consoleUrl, '去控制台查可用模型、申请令牌 ↗')), msgBox('apis'));
  load();
  return f;
}

/** 飞书应用：没配就是表单；配好了收成一个「换一个飞书应用」，点开同一张表单。换完要重新扫码（lark-cli 换应用会清掉登录） */
function larkAppForm() {
  const f = el('div', 'ck-more wz-form');
  const form = el('div');
  const tog = btn('换一个飞书应用');
  let ok = false, open = false;
  const togRow = row('wz-acts', tog);
  const cancel = btn('算了', 'ghost');
  const sync = () => { togRow.hidden = !ok || open; cancel.hidden = !ok; form.hidden = ok && !open; f.classList.toggle('is-min', ok && !open); };
  tog.onclick = () => { open = true; sync(); };
  cancel.onclick = () => { open = false; sync(); };
  const done = async () => { open = false; await reload('lark'); };
  const team = preset.larkApp.appId && preset.larkApp.hasSecret;
  if (team) {
    const b = btn('使用团队应用', 'primary', 'lark-app');
    b.onclick = () => act(b, 'lark', '/api/setup/lark/app', {}, done);
    form.append(el('p', 'wz-hint', `团队已经准备好了飞书应用（${preset.larkApp.appId}），直接用它就行。`), row('wz-acts', b));
  }
  const id = inp('cli_ 开头的一串'), sec = inp('', 'password');
  const save = btn('保存', team ? '' : 'primary', 'lark-app');
  save.onclick = () => {
    if (!id.value.trim() || !sec.value.trim()) return setMsg('lark-app', '两个都要填', 'bad');
    act(save, 'lark', '/api/setup/lark/app', { appId: id.value.trim(), appSecret: sec.value.trim() }, async () => { sec.value = ''; await done(); });
  };
  form.append(el('p', 'wz-hint', (team ? '或者用别的应用：' : '') + '找管理员要飞书应用的 App ID 和 App Secret，填在这里。换了应用要重新扫码登录。'),
    row('wz-g2', field('App ID', id), field('App Secret', sec)), row('wz-acts', save, cancel));
  f.append(togRow, form, msgBox('lark-app'));
  f.upd = (c) => { ok = c.state === 'ok'; sync(); };
  return f;
}

function larkLoginForm() {
  const f = el('div', 'ck-more wz-form');
  const b = btn('扫码登录', 'primary', 'lark-login');
  const hint = el('span', 'wz-hint');
  const qr = el('div', 'qr-box'); qr.hidden = true;
  f.append(row('wz-acts', b, hint), msgBox('lark-login'), qr);
  let timer = 0;
  // 二维码要在面板里展开：登好了收成按钮的那个状态先撤掉
  b.onclick = () => (f.classList.remove('is-min'), act(b, 'lark', '/api/setup/lark/login', {}, (d) => {
    clearInterval(timer);
    const img = el('img'); img.src = d.qr; img.alt = '飞书登录二维码'; img.hidden = !d.qr;   // 后端生成二维码失败时只给链接
    const remain = el('div', 'qr-left');
    const side = el('div');
    side.append(el('div', 'qr-t', '用飞书 App 扫一扫'), el('p', 'wz-hint', '在手机上确认授权，这里会自动打勾。'),
      link(d.url, '扫不了？在浏览器里打开这个链接 ↗'), remain);
    qr.replaceChildren(img, side); qr.hidden = false;
    b.textContent = '换一张二维码';
    const end = Date.now() + (d.expiresIn || 0) * 1000;
    const tick = () => {
      const sec = Math.max(0, Math.round((end - Date.now()) / 1000));
      remain.textContent = sec ? `二维码 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')} 后失效` : '二维码过期了，点上面「换一张二维码」';
      img.classList.toggle('is-expired', !sec);
      if (!sec) clearInterval(timer);
    };
    tick(); timer = setInterval(tick, 1000);
  }));
  // 登好了按钮还在：重新扫一次 = 换账号（lark-cli 登录是替换，不是再加一个）
  let ok = false;
  const idle = () => { b.textContent = ok ? '重新扫码 · 换账号' : '扫码登录'; b.classList.toggle('primary', !ok); f.classList.toggle('is-min', ok); };
  f.done = () => { clearInterval(timer); qr.hidden = true; idle(); };
  f.upd = (c, s) => {
    ok = c.state === 'ok';
    if (qr.hidden) idle();
    // lark-cli 登录前得先配好应用
    const app = s.checks.find((x) => x.id === 'app');
    const appOk = !app || app.state === 'ok';
    b.disabled = !appOk;
    hint.textContent = appOk ? '' : '先配好上面的飞书应用';
  };
  return f;
}

function gitTokenForm(host) {

}

function addRepoForm(ws) {
  if (addForms.has(ws)) return addForms.get(ws);
  const key = 'add-repo:' + ws;
  const url = inp('仓库地址，比如 git@github.com:组/仓库.git'), nm = inp('名字（可不填）');
  nm.className = 'is-short';
  const b = btn('加进来', 'primary', key);
  b.onclick = () => {
    if (!url.value.trim()) return setMsg(key, '先填仓库地址', 'bad');
    act(b, 'workspace', '/api/setup/workspace/add-repo', { workspace: ws, url: url.value.trim(), name: nm.value.trim() || undefined }, () => {
      url.value = ''; nm.value = ''; f.hidden = true;
    });
  };
  const f = el('div');
  f.hidden = true;
  f.append(row('wz-inline', url, nm, b), msgBox(key));
  addForms.set(ws, f);
  return f;
}

function repoList(w) {
  const repos = [...(w.repos || [])].sort((a, b) => (a.state === 'ok') - (b.state === 'ok'));
  const bad = repos.filter((r) => r.state !== 'ok').length;
  const d = el('details', 'ws-repos');
  d.append(el('summary', null, repos.length ? `${repos.length} 个仓库` + (bad ? ` · ${bad} 个有问题` : ' · 都是最新') : '还没有仓库'));
  d.open = reposOpen.get(w.name) ?? (bad > 0 || repos.length <= 6);
  d.ontoggle = () => reposOpen.set(w.name, d.open);
  const list = el('div', 'ws-list');
  for (const r of repos) {
    const rm = btn('删除', 'ghost danger', `rm:${w.name}/${r.name}`);
    rm.hidden = !r.removable;   // 子模块、顶层仓库删不了（后端会拒），不给按钮
    rm.onclick = async () => await ask(`确定从工作区「${w.name}」里删掉仓库「${r.name}」？`, '删掉')
      && act(rm, 'workspace', '/api/setup/workspace/remove-repo', { workspace: w.name, repo: r.name });
    const date = r.date == null ? '' : typeof r.date === 'number' ? new Date(r.date).toLocaleString('zh-CN', { hour12: false }) : String(r.date);
    const line = row('ws-repo', el('b', null, r.name), el('span', 'ws-pill s-' + r.state, REPO_ST[r.state] || r.state), el('span', 'ws-date', date), rm);
    line.title = r.url || r.path || '';
    if (r.error) line.append(el('div', 'ws-err', r.error));
    line.append(msgBox(rm.dataset.key));
    list.append(line);
  }
  d.append(list);
  return d;
}

function otherWays() {
  const d = el('details', 'ws-other');
  d.append(el('summary', null, '其他方式：拉别的仓库 · 新建空工作区 · 用电脑上已有的目录'));
  const form = (title, hint, inputs, label, route, body, then) => {
    const key = 'ws-' + route;
    const b = btn(label, null, key);
    b.onclick = () => {
      if (!inputs[0].value.trim()) return setMsg(key, '先把第一个框填上', 'bad');
      act(b, 'workspace', route, body(), async (r) => {
        inputs.forEach((i) => { i.value = ''; });
        if (!r.started) { setMsg(key, then?.(r) || '✓ 好了', 'ok'); await reload('workspace'); }
      });
    };
    d.append(el('span', 'wz-lb', title), el('p', 'wz-hint', hint), row('wz-inline', ...inputs, b), msgBox(key));
    return b;
  };
  const cu = inp('仓库地址（git@… 或 https://…）'), cn = inp('名字（可不填）');
  cn.className = 'is-short';
  form('拉一个仓库当工作区', '比如一个带好多子仓库的总仓库。拉下来就能用，没权限的子仓库会跳过。', [cu, cn], '拉取',
    '/api/setup/workspace/clone', () => ({ url: cu.value.trim(), name: cn.value.trim() || undefined }));
  const nn = inp('工作区名字，比如 my-workspace');
  form('新建空工作区', '建好之后，在它的卡片上点「加仓库」一个个加。', [nn], '新建',
    '/api/setup/workspace/create', () => ({ name: nn.value.trim() }), (r) => '✓ 建好了' + (r.path ? '：' + r.path : ''));
  const ep = inp('目录的完整路径，比如 /Users/me/code/order'), en = inp('名字（可不填）');
  en.className = 'is-short';
  const reg = form('用电脑上已有的目录', '代码已经在你电脑上了，就填它所在的文件夹路径（桌面版可以直接选）。登记过的目录，模板里选项目时就能挑。', [ep, en], '登记',
    '/api/setup/workspace/add-existing', () => ({ path: ep.value.trim(), name: en.value.trim() || undefined }), () => '✓ 登记好了');
  // 桌面版能弹系统的选文件夹框：选完直接登记，不用手抄路径（Windows 上尤其难抄）
  fetch('/api/projects').then((r) => r.json()).then((p) => {
    if (!p.canPick) return;
    const pk = btn('选择文件夹…');
    pk.onclick = async () => {
      const r = await call('/api/pick-folder', {}).catch(() => ({}));
      if (r.path) { ep.value = r.path; reg.click(); }
    };
    ep.before(pk);
  }).catch(() => {});
  return d;
}

/* ---------- 插件面板 ---------- */
function pluginPanel() {
  const b = btn('重新检测', null, 'mcp-refresh');
  b.onclick = () => act(b, 'plugin', '/api/setup/mcp/refresh', {});
  const p = el('div');
  p.append(row('wz-acts', b, el('span', 'wz-hint pl-hint', '点「授权」会打开浏览器：登录并同意就好，完成后自动打勾。状态不对再点「重新检测」。')),
    msgBox('mcp-refresh'));
  return p;
}

/* ---------- 进度（SSE） ---------- */
function logLine(l) { return el('div', l.ok === true ? 'is-ok' : l.ok === false ? 'is-bad' : null, l.msg); }
function log(sid, msg, ok) {
  const lines = logs.get(sid) || [];
  logs.set(sid, lines);
  lines.push({ msg, ok });
  if (lines.length > 300) lines.shift();
  const box = cards.get(sid)?.querySelector('.sx-log');
  if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.append(logLine({ msg, ok }));
  if (box.childElementCount > 300) box.firstChild.remove();
  if (near) box.scrollTop = box.scrollHeight;
}

const es = new EventSource('/api/events');
let dropped = false;
es.onopen = () => {
  $('dot').className = 'dot on'; $('conn-t').textContent = '已连接';
  // 断过线：中间的 done 可能漏了（服务也可能重启过），按钮别一直转，状态重新拉
  if (dropped) { dropped = false; pending.clear(); syncBusy(); reload('workspace'); }
};
es.onerror = () => { dropped = true; $('dot').className = 'dot'; $('conn-t').textContent = '连接断开，重连中…'; };
es.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type !== 'setup') return;
  log(m.section, m.msg, m.done ? !!m.ok : undefined);
  if (!m.done) return;
  // ponytail: 同一段里同时跑两个慢操作，第一个 done 就把两个按钮都放开了；要分开得让后端在进度里带操作 id
  for (const [k, sid] of pending) if (sid === m.section) pending.delete(k);
  syncBusy();
  if (m.section === 'lark') extras.get('lark/login')?.done();
  reload(m.section);
};

(async () => {
  const p = await get('/api/setup/preset').catch(() => ({}));
  preset = { gitHosts: [], workspaces: [], plugins: [], gitTokenUrl: '', ...p,
    larkApp: { appId: '', hasSecret: false, ...p.larkApp }, gateway: { baseUrl: '', consoleUrl: '', model: '', ...p.gateway } };
  $('secs').before(msgBox('status'));
  await refresh();
  loadWs();
})();
</script>
