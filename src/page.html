<body>

<header class="topbar">
  <span class="brand">lark<b>·</b>cc<b>·</b>router</span>
  <span class="conn"><span id="dot" class="dot"></span><span id="stat">连接中…</span></span>
  <span class="spacer"></span>
  <button id="btn-setup">上手向导</button>
  <button id="btn-run">试跑</button>
  <button id="btn-cfg">设置</button>
</header>

<div class="stage" id="stage">
  <aside class="col rail">
    <div class="colhead">
      <input id="gsearch" placeholder="搜群 / 人…">
      <div class="railfilters">
        <button id="f-hasjobs" class="chipbtn" aria-pressed="false" title="只列有过作业的会话，最近的在上面">有作业的</button>
        <div class="seg" id="gkind"></div>
      </div>
    </div>
    <div class="scroll"><ul class="glist" id="groups"></ul></div>
  </aside>

  <section class="col mid">
    <div class="ghead" id="ghead"></div>
    <div class="jsearch"><input id="jsearch" type="search" placeholder="搜问过的 / 答过的…"></div>
    <div class="scroll"><ul class="jobs" id="jobs"></ul></div>
  </section>

  <section class="col main">
    <div class="dhead" id="dhead" hidden></div>
    <div class="dsplit">
    <div class="dconv">
    <div class="dwrap">
      <div class="dbody" id="dbody"></div>
      <nav class="tmap" id="tmap" tabindex="0" aria-label="每一问" hidden></nav>
    </div>
    <div class="composer" id="composer" hidden>
      <textarea id="c-q" rows="1" placeholder="接着问…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div class="crow">
        <label class="ccheck" id="c-replybox"><input type="checkbox" id="c-reply"><span id="c-reply-t"></span></label>
        <span class="note" id="c-stat"></span>
        <span class="spacer"></span>
        <button class="primary" id="c-go">发送</button>
      </div>
    </div>
    </div>
    <aside class="side" id="side" aria-label="这一串的信息" hidden></aside>
    </div>
  </section>

  <div class="stage-grip" data-col="rail" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="会话列表宽度" title="拖动改宽度 · 双击恢复默认"></div>
  <div class="stage-grip" data-col="mid" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="作业列表宽度" title="拖动改宽度 · 双击恢复默认"></div>
</div>

<div class="setpage" id="settings" role="region" aria-label="设置" hidden>
  <nav class="setnav" id="set-nav"></nav>
  <div class="setpane">
    <header class="sethead" id="set-head"></header>
    <div class="setbody" id="set-body"></div>
    <footer class="setfoot">
      <span id="set-stat" class="note"></span>
      <span class="spacer"></span>
      <button id="set-revert">撤销改动</button>
      <button class="primary" id="set-save">保存</button>
    </footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="modal" id="run" hidden>
  <div class="sheet" role="dialog" aria-label="试跑">
    <header><h2>试跑</h2><span class="spacer"></span><button class="icon" id="run-close" aria-label="关闭">✕</button></header>
    <div class="sbody">
      <p class="note" style="margin:0">按这个会话的配置真跑一次 Claude Code，进度进中间那栏。卡片以你的身份<b>发给你自己</b>（不进群），顺带验一下飞书这条路通不通；不占去重记录。</p>
      <label class="fld"><span>当成哪个会话</span><select id="r-chat"></select></label>
      <label class="fld"><span>用哪个模板</span><select id="r-tpl"></select></label>
      <div class="fld"><span>项目</span><div id="r-projbox"></div></div>
      <textarea id="r-q" rows="4" placeholder="这个订单为什么改不了"></textarea>
      <div class="echo" id="r-echo"></div>
    </div>
    <footer class="sfoot"><button class="primary" id="run-go">跑一次</button><button id="run-judge">只看判定</button><span class="note" id="run-stat" style="margin:0"></span></footer>
  </div>
</div>

<script src="/vendor/marked.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
/**
 * 二次确认。不用 confirm()：浏览器里点开别处、或者勾了「禁止此页再显示对话框」之后，这一页后面的 confirm()
 * 都不弹、直接当「取消」，按钮看着就像坏了。<dialog> 是页面自己的元素，掐不掉
 */
function ask(msg, yes = '确定') {
  const d = el('dialog', 'ask'), f = el('form'), row = el('div');
  const no = el('button', 'ghost', '取消'), ok = el('button', 'primary', yes);
  f.method = 'dialog'; no.value = ''; ok.value = 'ok';
  row.append(no, ok); f.append(el('p', null, msg), row); d.append(f);
  document.body.append(d);
  d.showModal(); ok.focus();
  return new Promise((r) => d.addEventListener('close', () => { d.remove(); r(d.returnValue === 'ok'); }));
}
const STATUS_CN = { running: '处理中', done: '完成', failed: '中断', skipped: '跳过' };
const ARG_KEYS = ['command', 'file_path', 'path', 'pattern', 'query', 'url', 'prompt', 'description', 'skill'];
const TPL_COLOR = { blue: '#3370FF', green: '#34C724', orange: '#FF8800', red: '#F54A45', grey: '#8F959E', turquoise: '#00D6B2', violet: '#7F3BF5' };

let jobs = new Map();      // id -> job（含 events）
let cfg = null;            // 服务端当前配置（含 resolved：每个会话叠完模板后的实际值）
let allChats = null;       // [{chatId,name,avatar,lastAt}]
let chatsErr = '';   // /api/chats 报错（多半是飞书还没登录）：别一直显示「加载中」
let grp = '';              // 选中的群 id；'' = 全部作业
let sel = null;   // 作业 id；右栏摆的是它所在的那一串（同一个 session）
let gq = '', jq = '';      // 会话搜索 / 作业搜索
// 左栏：只看有作业的会话。入口全开（所有群 + 所有私聊）时"已启用"等于全部，筛不出东西，有没有作业才是真区别
let gHasJobs = false;
try { gHasJobs = localStorage.getItem('lcr.hasJobs') === '1'; } catch (e) {}
let gKind = 'all';         // 左栏：all | group | p2p
let jMode = 'all';         // 作业列表：all | user（@我）| bot（@机器人）。左栏的计数也跟着它
const modeOk = (j) => jMode === 'all' || j.mode === jMode;
/* 同一个 session 的追问聚成一串：中栏一行、右栏一段对话。还没跑起来（没 session）的自己一串 */
const keyOf = (j) => j.session || j.id;
const selKey = () => { const j = sel && jobs.get(sel); return j ? keyOf(j) : null; };
const inSel = (j) => !!sel && keyOf(j) === selKey();
const groupOf = (k) => [...jobs.values()].filter((j) => keyOf(j) === k).sort((a, b) => a.startedAt - b.startedAt);

/* ---------- 小工具 ---------- */
const oneLine = (s) => String(s ?? '').replace(/\s+/g, ' ').trim();
function argSummary(input) {
  if (input && typeof input === 'object') {
    for (const k of ARG_KEYS) if (typeof input[k] === 'string' && input[k]) return oneLine(input[k]).slice(0, 140);
    try { return oneLine(JSON.stringify(input)).slice(0, 140); } catch (e) { return ''; }
  }
  return typeof input === 'string' ? oneLine(input).slice(0, 140) : '';
}
const chatOf = (id) => (allChats || []).find((c) => c.chatId === id);
/* 两个入口。一个会话在某个入口上算开着：入口开着，而且勾了它、或者被「所有私聊 / 所有群」盖住 */
const MODES = [['user', '@我'], ['bot', '@机器人']];
const covered = (m, id) => { const k = chatOf(id)?.mode; return k === 'p2p' ? !!m.allP2p : k === 'group' && !!m.allGroups; };
const onIn = (mode, id) => { const m = cfg?.[mode]; return !!m?.on && (id in m.chats || covered(m, id)); };
const onAny = (id) => onIn('user', id) || onIn('bot', id);
/** 这个会话在这个入口上实际用的模板；没开就是 null */
const resolvedFor = (mode, id) => { const m = cfg?.[mode]; return m && (m.resolved?.[id] || (covered(m, id) ? m.fallback : null)); };
const chatName = (id) => !id ? '试跑' : (chatOf(id)?.name || id);
const projName = (p) => String(p || '').replace(/^.*\//, '') || '—';
function dur(ms) {
  if (ms < 950) return (ms / 1000).toFixed(1) + 's';
  const s = Math.round(ms / 1000);
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's';
}
function clock(t) { return new Date(t).toLocaleTimeString('zh-CN', { hour12: false }); }
function fullTime(t) { return new Date(t).toLocaleString('zh-CN', { hour12: false }); }
const tok = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 100_000 ? 0 : 1) + 'k' : String(n);
/**
 * 一串事件里的用量（跟服务端 agent.ts 的 Usage 一个算法）：上下文取最后一次调模型的，输出按回复去重求和，
 * 跟跑完 result 给的总数比取大的（实时流里每条回复的输出数是半截的）
 */
function usageOf(events) {
  let ctx = 0, model = '', totals = 0, any = false;
  const outs = new Map();
  for (const e of events || []) {
    if (e.kind !== 'usage') continue;
    any = true;
    if (e.total) { totals += e.out; continue; }
    if (e.ctx) ctx = e.ctx;
    if (e.model) model = e.model;
    outs.set(e.msgId || '', Math.max(outs.get(e.msgId || '') || 0, e.out));
  }
  return any && { ctx, model, out: Math.max([...outs.values()].reduce((a, b) => a + b, 0), totals) };
}
/** 作业的用量：有事件就现算（跑着的会一直涨），重启后的历史作业用库里存的 */
const jobUse = (j) => usageOf(j?.events) || (j?.ctx || j?.out ? { ctx: j.ctx || 0, out: j.out || 0, model: '' } : null);

/** 列表里的时间：今天只写时分，今年写月日，再早带上年 */
function when(t) {
  const d = new Date(t), now = new Date(), p = (n) => String(n).padStart(2, '0');
  const hm = p(d.getHours()) + ':' + p(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '-') + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + hm;
}
// 卡片没发出去 / 没改上：CC 跑完了也不算完成，群里看到的不是结论
const st = (j) => (j.sendError && j.status !== 'running' ? '没发出去' : STATUS_CN[j.status] || j.status);
/** 群头像。加载不出来（CDN 挂了、URL 过期）就退回首字色块 */
function avatarNode(c, big) {
  const w = el('span', 'gav' + (big ? ' big' : ''));
  const name = c?.name || c?.chatId || '?';
  const fallback = () => { w.textContent = [...name][0] || '?'; w.style.background = hue(c?.chatId || name); };
  if (c?.avatar) {
    const img = el('img'); img.src = c.avatar; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.remove(); fallback(); };
    w.appendChild(img);
  } else fallback();
  return w;
}
function hue(s) {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 28% 54%)`;   // 压低饱和度，跟暖灰底色不打架
}

/* ---------- 左列：群 ---------- */
const isP2P = (id) => chatOf(id)?.mode === 'p2p';

function renderGroups() {
  const ul = $('groups');
  ul.textContent = '';
  if (gKind === 'all') ul.appendChild(groupRow({ chatId: '', name: '全部作业' }, true));
  if (!allChats) { ul.appendChild(el('li', 'note', '会话列表加载中（要起几次 lark-cli，几秒）…')); return; }
  if (chatsErr) ul.appendChild(el('li', 'note', '拿不到会话列表：飞书还没登录的话，去右上角「上手向导」登录'));

  const known = new Set(allChats.map((c) => c.chatId));
  // 已勾但不在列表里的（退群了之类）也列出来，否则没地方取消
  // 有作业但掉出了飞书前 100 个活跃会话的，也补上，不然中栏有作业、左栏找不到
  const extra = [...new Set([...Object.keys(cfg?.user.chats || {}), ...Object.keys(cfg?.bot.chats || {}), ...[...jobs.values()].map((j) => j.chatId)])]
    .filter((id) => id && !known.has(id))
    .map((id) => ({ chatId: id, name: id, mode: 'group' }));
  const kw = gq.trim().toLowerCase();
  let list = [...allChats, ...extra]
    .filter((c) => gKind === 'all' || c.mode === gKind)
    .filter((c) => !kw || (c.name + ' ' + c.chatId).toLowerCase().includes(kw));
  // 只看有作业的时候按最近一条作业排，像收件箱；平时沿用飞书的活跃顺序。跟着中栏的 @我 / @机器人 走
  if (gHasJobs) {
    const last = new Map(list.map((c) => [c.chatId, stats(c.chatId).last]));
    list = list.filter((c) => last.get(c.chatId)).sort((a, b) => last.get(b.chatId) - last.get(a.chatId));
  }
  for (const c of list) ul.appendChild(groupRow(c, false));
  if (!list.length) ul.appendChild(el('li', 'note', allChats.length ? '没有匹配的' : ''));
}

function groupRow(c, isAll) {
  const on = isAll || onAny(c.chatId);
  const li = el('li', 'grp' + (on ? ' on' : '') + (grp === c.chatId ? ' sel' : ''));
  li.append(isAll ? el('span', 'gav', '全') : avatarNode(c));

  const txt = el('span', 'gtxt');
  txt.appendChild(el('b', null, c.name));
  // 栏窄，年份省掉；没时间就退回"处理过几条"。单聊标出来，不然跟群混在一起分不清
  const n = stats(c.chatId).total;
  const when = c.lastAt ? String(c.lastAt).replace(/^\d{4}-/, '') : '';
  const bits = [];
  if (!isAll && c.mode === 'p2p') bits.push('私聊');
  if (when) bits.push(when);
  else if (n) bits.push(`处理过 ${n} 条`);
  txt.appendChild(el('small', null, isAll ? '所有会话的作业' : bits.join('　')));
  li.appendChild(txt);

  const s = stats(c.chatId);
  const badge = el('span', 'gbadge');
  if (s.running) badge.appendChild(el('span', 'pulse'));
  if (s.failed) badge.appendChild(el('i', 'bad', String(s.failed)));
  li.appendChild(badge);

  li.onclick = () => { grp = c.chatId; sel = null; renderGroups(); renderMid(); renderDetail(); };
  return li;
}

/** 某个会话（或全部）的作业统计 */
function stats(chatId) {
  let running = 0, failed = 0, total = 0, last = 0;
  for (const j of jobs.values()) {
    if (j.test || !modeOk(j)) continue;
    if (chatId && j.chatId !== chatId) continue;
    total++;
    last = Math.max(last, j.startedAt);
    if (j.status === 'running') running++;
    else if (j.status === 'failed') failed++;
  }
  return { running, failed, total, last };
}

/* ---------- 中列：这个会话 + 它的作业 ---------- */
function renderMid() {
  const head = $('ghead');
  head.textContent = '';
  const isAll = !grp;
  const c = isAll ? null : (chatOf(grp) || { chatId: grp, name: grp });
  const r = isAll ? null : (resolvedFor('user', grp) || resolvedFor('bot', grp));

  const row = el('div', 'row2');
  row.appendChild(isAll ? el('span', 'gav big', '全') : avatarNode(c, true));
  const box = el('div'); box.style.minWidth = '0'; box.style.flex = '1';
  box.appendChild(el('h2', null, isAll ? '全部作业' : c.name));
  // 名字底下只留一行：私聊还是群、在哪个项目里查。模板在下面的下拉框里，不重复写；其余收进「详情」
  const sub = el('div', 'sub');
  let info = null;
  if (isAll) sub.appendChild(el('span', null, MODES.filter(([k]) => cfg?.[k].on).map(([k, n]) => `${n}：${scopeText(cfg[k])}`).join('　') || '两个入口都关着'));
  else {
    sub.appendChild(el('span', null, [c.mode === 'p2p' ? '私聊' : '群', r?.project && `在 ${projName(r.project)} 里查`].filter(Boolean).join(' · ')));
    const [btn, dl] = infoToggle('g', [
      ['会话 ID', c.chatId], ['项目', r?.project], ['模型', r && (r.model || '默认')],
      ['权限', r && permLabel(r)], ['回复', r && (r.judge ? '先判定要不要回' : '直接回')], ['API', r && apiText(r)],
    ]);
    sub.appendChild(btn); info = dl;
  }
  box.appendChild(sub);
  row.appendChild(box);
  head.appendChild(row);
  if (info) head.appendChild(info);
  if (!isAll) head.appendChild(chatCtl(grp));

  // 按入口筛。机器人没开过、也没有它的作业的时候，这排只是噪音 —— 不显示的时候总数才单独标出来
  const here = [...jobs.values()].filter((j) => !grp || j.chatId === grp);
  const showSeg = cfg?.bot.on || here.some((j) => j.mode === 'bot');
  if (isAll) {
    const t = here.filter((j) => j.test).length;
    const sum = el('div', 'gsum');
    if (!showSeg) sum.append(tag(`共 ${here.length - t} 条作业`));
    if (t) sum.append(tag(`试跑 ${t} 条`));   // 0 条的时候这个标签只是在占地方
    if (sum.childNodes.length) head.appendChild(sum);
  }
  if (showSeg) {
    const seg = el('div', 'seg jfilter');
    seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', '按入口筛作业');
    for (const [k, label] of [['all', '全部'], ['user', '@我'], ['bot', '@机器人']]) {
      const n = k === 'all' ? here.length : here.filter((j) => j.mode === k).length;
      const b = el('button', null, `${label} ${n}`);
      b.setAttribute('aria-pressed', String(jMode === k));
      b.onclick = () => { jMode = k; if (sel && !modeOk(jobs.get(sel) || {})) sel = null; renderGroups(); renderMid(); renderDetail(); };
      seg.appendChild(b);
    }
    head.appendChild(seg);
  }

  const ul = $('jobs');
  ul.textContent = '';
  const byKey = new Map();
  for (const j of here.filter(modeOk)) { const k = keyOf(j); if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(j); }
  // 搜索对整串：哪一问、哪条结论对上了都算
  const hit = (j) => (j.q + ' ' + j.who + ' ' + chatName(j.chatId) + ' ' + (j.answer || '')).toLowerCase().includes(jq);
  const list = [...byKey.values()]
    .map((g) => g.sort((a, b) => a.startedAt - b.startedAt))
    .filter((g) => !jq || g.some(hit))
    .sort((a, b) => b.at(-1).startedAt - a.at(-1).startedAt);
  if (!list.length) {
    const li = el('li', 'jempty');
    li.append(
      el('div', 'je-t', jq ? '没有对得上的' : here.length ? '这个入口下没有作业' : (grp ? '这个会话还没人 @你' : '还没人 @你')),
      el('div', 'je-s', jq ? '问题、提问的人、会话名、结论都会搜' : here.length ? '换个筛选看看' : '有人 @你 或 @机器人，就会出现在这里'),
    );
    ul.appendChild(li);
    return;
  }
  for (const g of list) {
    const first = g[0], j = g.at(-1);
    const li = el('li', g.some((x) => x.id === sel) ? 'sel' : '');
    const line = el('div', 'jline');
    line.append(el('span', 'pill ' + j.status, st(j)));
    if (g.length > 1) line.append(tag(`${g.length} 问`));
    line.append(el('span', 'jtime', when(j.startedAt)));
    li.append(line, el('div', 'jq', first.q));
    if (g.length > 1) li.append(el('div', 'jlast', '↳ ' + oneLine(j.q)));
    // 结论开头一两行：翻历史的时候不用点进去就知道答了什么
    const ans = [...g].reverse().find((x) => x.answer)?.answer;
    if (ans) li.append(el('div', 'jans', oneLine(ans.replace(/[#*`>|]/g, '')).slice(0, 160)));
    const meta = el('div', 'jmeta');
    if (j.test && !g.some((x) => !x.test)) meta.append(el('span', null, j.reply ? '网页追问' : '试跑'));
    else {
      const src = g.find((x) => !x.test) || j;
      if (src.mode === 'bot') meta.append(el('span', 'pill', '@机器人'));
      const whos = [...new Set(g.filter((x) => !x.test).map((x) => x.who))];
      meta.append(el('span', null, whos.slice(0, 2).join('、') + (whos.length > 2 ? ` 等 ${whos.length} 人` : '')));
      // 单聊里发问的人就是会话本身，照写会得到"张三 ▸ 张三"；没项目也别挂个"▸ —"
      const where = grp ? src.project && projName(src.project) : chatName(src.chatId);
      if (where && !whos.includes(where)) meta.append(el('span', 'jwhere', '▸ ' + where));
    }
    // 上下文看最近一问的（这个 session 现在多大），输出是整串加起来
    const uses = g.map(jobUse).filter(Boolean);
    const nums = el('div', 'jmeta');
    const txt = [j.endedAt && dur(j.endedAt - j.startedAt),
      uses.length && `上下文 ${tok(uses.at(-1).ctx)}`, uses.length && `输出 ${tok(uses.reduce((n, u) => n + u.out, 0))}`].filter(Boolean).join(' · ');
    if (txt) nums.append(el('span', null, txt));
    // 只有"没发出去"才值得标出来 —— 每条都挂个"已发出"只是噪音
    if (!j.posted || j.sendError) nums.append(threadChip(j));
    li.append(meta);
    if (nums.childNodes.length) li.append(nums);
    li.onclick = () => { sel = j.id; renderMid(); renderDetail(); };
    ul.appendChild(li);
  }
}

const tag = (text, cls) => el('span', 'tag' + (cls ? ' ' + cls : ''), text);

/** 这个会话的 CC 打哪些 API 来源（按顺序，出问题换下一个）。一个都没配就跟 claude 自己的配置走 */
const apiText = (r) => r.agent === 'codex' ? '本机 Codex App Server' : r.apis?.length ? r.apis.join(' → ') : (cfg?.ownClaude || '跟 claude 自己的配置走');

/** 头部的「详情」按钮 + 它展开的 kv 表（空值的行不出）。开合状态存在 infoOpen 里，SSE 推一次重画一次也不会自己合上 */
const infoOpen = { g: false };
function infoToggle(k, pairs) {
  pairs = pairs.filter(([, v]) => v);
  const b = el('button', 'ghost hinfo-btn', '详情');
  b.title = pairs.map(([t, v]) => `${t}：${v}`).join('\n');
  const dl = el('dl', 'kv hinfo');
  for (const [t, v] of pairs) dl.append(el('dt', null, t), el('dd', null, v));
  const paint = () => { b.setAttribute('aria-expanded', String(infoOpen[k])); dl.hidden = !infoOpen[k]; };
  b.onclick = () => { infoOpen[k] = !infoOpen[k]; paint(); };
  paint();
  return [b, dl];
}

/** 飞书那边到底有没有那张卡片 —— 闲聊是一条都不发的，得让人看出来 */
function threadChip(j) {
  if (j.sendError && j.status !== 'running') {
    const p = el('span', 'pill failed', j.posted ? '卡片没改上' : '卡片没发出');
    p.title = j.sendError;
    return p;
  }
  if (j.test) return j.posted ? el('span', 'pill done', '已发给自己')
    : el('span', 'pill' + (j.status === 'running' ? '' : ' failed'), j.status === 'running' ? '卡片发送中' : '卡片没发出');
  if (j.posted) return el('span', 'pill done', '已发出');
  if (j.status === 'running') return el('span', 'pill running', '还没发出 · 在看要不要回');
  if (j.status === 'skipped') return el('span', 'pill', '没发出 · ' + (j.reason ? j.reason.split('：')[0] : '判断不用回'));
  return el('span', 'pill failed', '没发出');
}

/* ---------- 右列：详情 ---------- */
let shownKey = null;   // 右栏现在摆的是哪一串：换了一串滚到底（最新那一问），同一串重画保住滚动位置
function renderDetail() {
  const j0 = sel && jobs.get(sel);
  const g = j0 ? groupOf(keyOf(j0)) : [];
  const j = g.at(-1);   // 头部、按钮都对着这一串里最新的那一问
  $('dhead').hidden = !j;
  const box = $('dbody');
  const same = shownKey === (j ? keyOf(j) : null), y = box.scrollTop;
  shownKey = j ? keyOf(j) : null;
  box.textContent = '';
  renderComposer(g);
  if (!j) {
    $('side').hidden = true;
    renderMap([]);
    box.appendChild(emptyState());
    return;
  }

  const h = $('dhead');
  h.textContent = '';
  const isBot = j.mode === 'bot';
  // 机器人的私聊不在我的会话列表里，认不出是私聊 —— 那就照群写，名字退回 id
  const dm = !j.test && isP2P(j.chatId);
  const whom = isBot ? '@机器人' : '@你';
  const src = g.find((x) => !x.test);
  h.appendChild(el('h2', null, !src ? (j.reply ? '网页追问' : '手动试跑') : dm ? `${src.who} 在私聊里 ${whom}` : `${src.who} 在「${chatName(src.chatId)}」${whom}`));
  // 标题底下一行：什么时候 · 私聊还是群 · 几问 · 飞书那边发没发，右边是按钮。别的都在侧栏
  const tb = el('div', 'toolbar');
  const meta = el('div', 'dmeta');
  meta.append(el('span', null, fullTime(g[0].startedAt)), el('span', null, '·'),
    el('span', null, j.test ? (j.chatId ? chatName(j.chatId) : '没指定会话') : dm ? '私聊' : '群'));
  if (g.length > 1) meta.append(el('span', null, '·'), el('span', null, `${g.length} 问`));
  meta.append(threadChip(j));
  const acts = el('div', 'tacts');
  tb.append(meta, acts);
  const session = g.find((x) => x.session)?.session;
  const t = session && !session.startsWith('codex:') ? tx.get(session) : null;
  if (t === undefined) loadTx(session);
  const turns = chatTurns(g, t && t !== 'loading' ? t.turns : []);
  const live = g.find((x) => x.status === 'running');
  if (live) {
    const stop = el('button', 'danger', '终止');
    stop.title = '杀掉这次 CC，群里的卡片收成「已手动停止」';
    stop.onclick = async () => {
      if (!(await ask('终止这次排查？', '终止'))) return;
      stop.disabled = true;
      const d = await post('/api/stop', { id: live.id });
      if (d.error) { alert(d.error); stop.disabled = false; }
    };
    acts.appendChild(stop);
  }
  // 结论有了、只是卡片没发出去：同一个按钮变成「重发到飞书」，不重跑。
  // 飞书里来的「再跑一次」：回原会话、用原身份重跑（@我 是你本人，@机器人 是机器人）。试跑的没有原会话，照旧弹试跑框发给自己
  const resendable = !!(j.sendError && j.answer && j.status !== 'running');
  const again = el('button', resendable ? 'primary' : null, resendable ? '重发到飞书' : '再跑一次');
  if (resendable) {
    again.title = '结论已经有了，只是卡片没发出去 / 没改上：把结论重新发一张卡片' + (j.test ? '给你自己' : '到原会话') + '，不重跑';
    again.onclick = async () => {
      if (!j.test && !(await ask(`把结论重新发到${isP2P(j.chatId) ? '原私聊' : '原话题'}里？`, '重发'))) return;
      again.disabled = true;
      const d = await post('/api/resend', { id: j.id, mode: j.mode });
      if (d.error) { alert(d.error); again.disabled = false; }
    };
  } else if (j.test) again.onclick = () => openRun(j);
  else {
    const where = isP2P(j.chatId) ? '原私聊' : '原话题';
    const as = j.mode === 'bot' ? '以机器人身份' : '以你的身份';
    again.title = `最新这一问${as}在${where}里重新回一次（不再判定）`;
    again.onclick = async () => {
      if (!(await ask(`${as}在${where}里重新回一次？`, '再跑一次'))) return;
      again.disabled = true;
      const d = await post('/api/rerun', { id: j.id, mode: j.mode });
      if (d.error) { alert(d.error); again.disabled = false; }
    };
    const tr = el('button', 'ghost', '试跑');
    tr.title = '改一改问题 / 项目再跑，卡片只发给你自己';
    tr.onclick = () => openRun(j);
    acts.appendChild(tr);
  }
  acts.appendChild(again);
  const side = el('button', 'ghost', '侧栏');
  side.setAttribute('aria-pressed', String(sideOpen));
  side.title = '这一串的概要、运行环境、用量、飞书卡片';
  side.onclick = () => { sideOpen = !sideOpen; try { localStorage.setItem('lcr.side', sideOpen ? '1' : '0'); } catch (e) {} renderDetail(); };
  acts.appendChild(side);
  h.appendChild(tb);

  box.appendChild(renderChat(turns, t));
  renderSide(g, turns, session, t, same);
  renderMap(turns);
  box.scrollTop = same ? y : box.scrollHeight;
  markTurn();
}

/** 对话右边的「每一问」小条 + 悬停弹出的列表。一问就不出（没什么好跳的） */
function renderMap(turns) {
  const m = $('tmap');
  m.textContent = '';
  m.hidden = turns.length < 2;
  m.closest('.dconv').classList.toggle('has-map', !m.hidden);
  if (m.hidden) return;
  const go = (i) => document.getElementById('turn-' + i)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const pop = el('div', 'tpop'), ol = el('ol');
  turns.forEach((tu, i) => {
    const x = tu.job, q = oneLine(x ? x.q : askOf(tu.prompt));
    const tick = el('i', x?.status === 'running' ? 'running' : x?.status === 'failed' ? 'failed' : '');
    tick.onclick = () => go(i);
    m.appendChild(tick);
    const li = el('li'), item = el('button');
    item.type = 'button';
    const top = el('span', 'st-top');
    top.append(el('span', 'pill ' + (x?.status || 'done'), x ? st(x) : '记录'), el('span', null, when(x?.startedAt || tu.t)),
      el('span', null, !x ? '网页上问的' : x.test ? (x.reply ? '网页追问' : '试跑') : x.who));
    item.append(top, el('span', 'st-q', q));
    const u = usageOf(tu.events) || jobUse(x);
    const bits = [x?.endedAt && dur(x.endedAt - x.startedAt), u && `上下文 ${tok(u.ctx)} · 输出 ${tok(u.out)}`].filter(Boolean);
    if (bits.length) item.appendChild(el('span', 'st-sub', bits.join(' · ')));
    item.title = q;
    item.onclick = () => go(i);
    li.appendChild(item);
    ol.appendChild(li);
  });
  pop.appendChild(ol);
  m.appendChild(pop);
}

/** 现在读到第几问：顶上三分之一处落在哪一问里。小条和列表里都标出来 */
function markTurn() {
  const box = $('dbody'), m = $('tmap');
  if (m.hidden) return;
  const line = box.getBoundingClientRect().top + box.clientHeight / 3;
  const turns = box.querySelectorAll('.turn');
  let cur = 0;
  turns.forEach((n, i) => { if (n.getBoundingClientRect().top <= line) cur = i; });
  // 滚到底了就是最后一问（最后一问很短的时候，它的顶永远到不了三分之一那条线）
  if (box.scrollTop + box.clientHeight >= box.scrollHeight - 4) cur = turns.length - 1;
  m.querySelectorAll(':scope>i').forEach((x, i) => x.classList.toggle('on', i === cur));
  m.querySelectorAll('li').forEach((x, i) => x.classList.toggle('on', i === cur));
}
let markQ = 0;
$('dbody').addEventListener('scroll', () => { cancelAnimationFrame(markQ); markQ = requestAnimationFrame(markTurn); }, { passive: true });

function emptyState() {
  const d = el('div', 'empty');
  const big = el('div', 'big');
  big.append(document.createTextNode('等一个 '), el('span', 'hl', '@我'));
  d.appendChild(big);
  const p = el('p', null, cfg ? '' : '连接中…');
  // 关着的入口给个直达链接：设置 → @我 / @机器人
  const off = (k, name) => { const a = el('button', 'link', '去打开'); a.onclick = () => openSettings(MODE_PANE[k]); p.append(`「${name}」关着，`, a, '。 '); };
  if (cfg) {
    if (cfg.user.on) p.append(`@我 盯着${scopeText(cfg.user)}，每 ${Math.round(cfg.pollMs / 1000)} 秒看一次：有人 @你，就自动跑一次，结论以你的身份回过去。 `); else off('user', '@我');
    if (cfg.bot.on) p.append(`@机器人 管着${scopeText(cfg.bot)}：有人 @它 或私聊它，马上跑，机器人回流式卡片。`); else off('bot', '@机器人');
  }
  d.appendChild(p);
  const b = el('button', 'primary', '手动试跑一次');
  b.onclick = () => openRun();
  d.appendChild(b);
  return d;
}

/*
 * 本机 claude 的 session 记录（/api/transcript）。逐条事件只在内存里，重启就没了；试跑不落库 —— 这两种的过程都从这儿找回来。
 * 跑完的那一问也用它（内存里最多留 400 条事件，长排查会被截掉开头）。跑着的那一问用内存里的实时事件
 */
const tx = new Map();   // session -> { cwd, turns } | 'loading'
async function loadTx(session) {
  tx.set(session, 'loading');
  let d = { turns: [] };
  try { d = await fetch('/api/transcript?session=' + encodeURIComponent(session)).then((r) => r.json()); } catch (e) {}
  tx.set(session, Array.isArray(d?.turns) ? d : { turns: [] });
  // ponytail: 只留最近看过的 20 串，一份记录可能好几 MB
  while (tx.size > 20) tx.delete(tx.keys().next().value);
  if (selKey() === session) renderDetail();
}

/** 发给模型的原话 → 人问的那句：去掉前面的话题上下文、后面的截图路径（见 pipeline 的 topicContext / withImages） */
const ASK_MARK = '这次 @你 的消息：';
function askOf(prompt) {
  const i = prompt.lastIndexOf(ASK_MARK);
  return (i >= 0 ? prompt.slice(i + ASK_MARK.length) : prompt).replace(/\n\n（消息里的截图已下载到本地：[\s\S]*$/, '').trim();
}

/**
 * 一串作业 + session 记录 → 按时间排的一问一答。记录里的每一问按原话认作业（作业的 q 就是那条飞书消息的正文）；
 * 认不出的（试跑、网页追问 —— 重启后作业没了）照样摆出来；判了不回、没跑过的作业没有记录，也摆出来
 */
function chatTurns(g, turns) {
  const left = [...g];
  const out = [];
  for (const tt of turns) {
    const i = left.findIndex((j) => j.q.trim() && tt.prompt.includes(j.q.trim().slice(0, 200)));
    const job = i >= 0 ? left.splice(i, 1)[0] : null;
    const mem = job && job.events.length && (job.status === 'running' || !tt.events.length);
    out.push({ ...tt, job, events: mem ? job.events : tt.events });
  }
  for (const job of left) out.push({ job, t: job.startedAt, events: job.events });
  return out.sort((a, b) => a.t - b.t);
}

function renderChat(turns, t) {
  const wrap = el('div', 'chat');
  turns.forEach((turn, i) => wrap.appendChild(turnNode(turn, i)));
  if (t === 'loading') wrap.appendChild(el('div', 'note', '在本机的 session 记录里找过程…'));
  return wrap;
}

function turnNode({ job, prompt, t, events }, i) {
  const n = el('div', 'turn');
  n.id = 'turn-' + i;
  const u = el('div', 'umsg');
  const head = el('div', 'uhead');
  head.append(el('b', null, !job ? '网页上问的' : job.test ? (job.reply ? '网页追问' : '试跑') : job.who), el('span', null, fullTime(job?.startedAt || t)));
  if (job?.mode === 'bot' && !job.test) head.append(el('span', 'pill', '@机器人'));
  if (job && (!job.posted || job.sendError || job.reply)) head.append(threadChip(job));
  const q = job ? job.q : askOf(prompt);
  const bubble = el('div', 'ububble');
  bubble.appendChild(mdNode(q));
  u.append(head, bubble);
  // 带了话题上下文的（第一问是话题里之前的全部，后面的是上次回复之后的新消息）：气泡底下折着，点开就地看
  const ctx = ctxParts(prompt);
  if (ctx) {
    const d = el('details', 'uctx');
    fold(d, 'ctx-' + (job?.id || t), false);
    d.appendChild(el('summary', null, `带了 ${ctx.filter((x) => x.who).length} 条话题消息`));
    for (const p of ctx) {
      if (!p.who) { d.appendChild(el('div', 'note', p.text)); continue; }
      const m = el('div', 'smsg');
      m.append(el('div', 'smsg-h', p.who + '　' + p.at), el('div', 'smsg-b', p.text));
      d.appendChild(m);
    }
    u.appendChild(d);
  }
  n.appendChild(u);

  const a = el('div', 'amsg');
  a._t0 = job?.startedAt || t; a._open = new Map(); a._live = job?.status === 'running';
  a._job = job; a._evs = []; a._foot = el('div', 'afoot');
  if (job) a.dataset.job = job.id;
  for (const ev of events || []) appendEv(a, ev);
  if (!a.querySelector('.atext')) {
    if (job?.answer) a.appendChild(answerNode(job.answer));
    else if (job?.status === 'skipped') a.appendChild(el('div', 'note', job.reason ? `判定 ${job.reason} —— 群里什么都没发。` : '判断这条不用回 —— 什么都没发出去。'));
    else if (job?.reason) a.appendChild(el('div', 'note', job.reason));
    else if (job && job.status !== 'running' && !events?.length) a.appendChild(el('div', 'note', '本机找不到这次的 session 记录（Codex，或者换过机器），过程没法找回来。'));
  }
  n.appendChild(a);
  if (job?.error) n.appendChild(el('div', 'aerr', job.error));
  n.appendChild(a._foot);
  paintFoot(a);
  return n;
}

/** 一问底下那行：状态、耗时、工具几次、上下文多大、输出多少。跑着的时候每来一条用量 / 工具就刷一次 */
function paintFoot(a) {
  const f = a._foot, job = a._job;
  const u = usageOf(a._evs) || (job && !a._evs.length ? jobUse(job) : null);
  const tools = a._evs.filter((e) => e.kind === 'tool').length;
  f.textContent = '';
  const pair = (k, v, unit = '') => { const p = el('span', null, k + ' '); p.append(el('b', null, v), unit); f.append(p); };
  if (job) f.append(el('span', 'pill ' + job.status, st(job)));
  if (job?.endedAt) pair('耗时', dur(job.endedAt - job.startedAt));
  if (tools) pair('工具', String(tools));
  if (u?.ctx) pair('上下文', tok(u.ctx), ' tokens');
  if (u?.out) pair('输出', tok(u.out), ' tokens');
  f.hidden = !f.childNodes.length;
}

const answerNode = (text) => { const d = el('div', 'atext'); d.appendChild(mdNode(text)); return d; };

/**
 * 往一问的回答里追加一个事件（整段重画和实时推送共用）。正文单独成段；挨着的思考 / 工具并成一个折叠的「过程」，
 * 摘要写用了哪些工具、几次、多久。跑着的时候过程是展开的
 */
function appendEv(a, ev) {
  a._evs.push(ev);
  if (ev.kind === 'usage' || ev.kind === 'tool') { if (a.isConnected || a.parentNode) paintFoot(a); }
  if (ev.kind === 'done' || ev.kind === 'usage') return;
  if (ev.kind === 'text') {
    const n = answerNode(ev.text);
    // Codex 的正文按 itemId 一段段刷新：同一段替换，不追加
    const old = ev.itemId && a.querySelector('[data-item-id="' + CSS.escape(ev.itemId) + '"]');
    if (ev.itemId) n.dataset.itemId = ev.itemId;
    if (old) old.replaceWith(n); else a.appendChild(n);
    return;
  }
  let g = a.lastElementChild;
  if (!g?.classList.contains('steps')) {
    g = el('details', 'steps');
    g.open = !!a._live;
    g.append(el('summary'), el('div', 'trace'));
    a.appendChild(g);
  }
  const n = evNode(ev, a._t0, a._open);
  if (n) g.lastElementChild.appendChild(n);
  if (ev.t) { g._from ??= ev.t; g._to = ev.t; }
  const count = new Map();
  let think = 0;
  for (const c of g.lastElementChild.children) {
    if (c.dataset.kind === 'thinking') think++;
    // MCP 工具名很长（mcp__plugin_xxx_DOT__sql_execute），摘要里只留最后一截
    if (c.dataset.kind === 'tool') { const k = c.querySelector('.chip').textContent.replace(/^⚙ /, '').replace(/^mcp__.*__/, ''); count.set(k, (count.get(k) || 0) + 1); }
  }
  const tools = [...count].sort((x, y) => y[1] - x[1]).map(([k, v]) => v > 1 ? `${k} ×${v}` : k);
  g.firstElementChild.textContent = ([...tools, think && `思考 ${think} 次`].filter(Boolean).join(' · ') || '开始')
    + (g._to > g._from ? ` · ${dur(g._to - g._from)}` : '');
}

function evNode(ev, t0, open) {
  // 工具的返回并进发起它的那次调用里，不另起一行 —— 返回 null 让调用方别 append
  if (ev.kind === 'result') {
    const src = open?.get(ev.id);
    if (src) {
      const d = src.node.querySelector('.dur');
      if (d && ev.t) d.textContent = dur(ev.t - src.t);
      open.delete(ev.id);
      src.node.appendChild(resultBody(ev, false));
      return null;
    }
  }
  const n = el('div', 'ev ' + ev.kind);
  n.dataset.kind = ev.kind;
  if (ev.t) n.appendChild(el('span', 'at', dur(ev.t - t0)));

  if (ev.kind === 'init') {
    n.appendChild(el('div', 'evhead', 'session ' + String(ev.sessionId || '').replace(/^codex:/, '').slice(0, 8) + (ev.model ? ' · ' + ev.model : '')));
    if (ev.cwd) n.appendChild(el('div', 'evsub', ev.cwd));
    // 授权过期 / 没连上的 MCP：claude 不报错照常跑，只是少了那批工具 —— 在这儿说出来
    // pending = init 那一刻还在连，不算坏
    const bad = (ev.mcp || []).filter((s) => s.status !== 'connected' && s.status !== 'pending');
    const pend = (ev.mcp || []).filter((s) => s.status === 'pending').length;
    if (bad.length) { const w = el('div', 'evsub', '⚠️ MCP 没连上：' + bad.map((s) => s.name + '（' + s.status + '）').join('、')); w.style.color = 'var(--bad)'; n.appendChild(w); }
    if (ev.mcp) n.appendChild(el('div', 'evsub', `MCP ${ev.mcp.length - bad.length - pend}/${ev.mcp.length} 已连${pend ? ` · ${pend} 个连接中` : ''} · plugin ${(ev.plugins || []).length} 个`));
  } else if (ev.kind === 'text') {
    if (ev.itemId) n.dataset.itemId = ev.itemId;
    n.appendChild(mdNode(ev.text));
  } else if (ev.kind === 'thinking') {
    const d = el('div', 'think');
    d.appendChild(mdNode(ev.text));
    n.appendChild(d);
  } else if (ev.kind === 'done') {
    n.appendChild(el('div', 'evhead', ev.ok ? '✓ 结束' : '✗ 结束'));
  } else if (ev.kind === 'tool') {
    const head = el('div', 'evhead');
    const chip = el('span', 'chip', '⚙ ' + ev.name);
    chip.title = ev.name;
    head.append(chip);
    const a = argSummary(ev.input);
    if (a) head.append(el('span', 'arg', a));
    head.append(el('span', 'dur', ''));
    n.appendChild(head);
    const d = el('details');
    d.appendChild(el('summary', null, '入参'));
    const pre = el('pre'); pre.textContent = JSON.stringify(ev.input, null, 2) || '';
    d.appendChild(pre);
    n.appendChild(d);
    if (open) open.set(ev.id, { node: n, t: ev.t, name: ev.name });
  } else if (ev.kind === 'result') {
    n.appendChild(resultBody(ev, true));   // 没配到发起方（事件被截断），单独摆一行
  }
  return n;
}

/** 一次工具返回。orphan = 没配到发起它的那次调用（事件被截断），得自己带个标题 */
function resultBody(ev, orphan) {
  const box = el('div', orphan ? null : 'evres');
  const head = el('div', 'evhead');
  head.append(el('span', 'chip' + (ev.isError ? ' err' : ''), orphan ? (ev.isError ? '❌ 返回' : '↳ 返回') : '↳'));
  const first = (ev.text || '').split('\n').find((l) => l.trim());
  if (first) head.append(el('span', 'arg', oneLine(first).slice(0, 160)));
  const d = el('details');
  d.appendChild(el('summary', null, '返回原文'));
  const pre = el('pre'); pre.textContent = (ev.text || '').slice(0, 20000);
  d.appendChild(pre);
  box.append(head, d);
  return box;
}

function copy(text, node) {
  navigator.clipboard?.writeText(text).then(() => {
    const old = node.textContent;
    node.textContent = '已复制';
    setTimeout(() => { node.textContent = old; }, 900);
  }).catch(() => {});
}

/* ---------- 侧栏 ---------- */
let sideOpen = true;
try { sideOpen = localStorage.getItem('lcr.side') !== '0'; } catch (e) {}
/** 侧栏里折叠块的开合：SSE 推一次就整个重画，不记的话点开的会自己合上 */
const sideFold = new Map();
const fold = (d, key, dflt) => { d.open = sideFold.has(key) ? sideFold.get(key) : dflt; d.ontoggle = () => sideFold.set(key, d.open); };
/**
 * 发给模型的原话里，人问的那句之前的话题上下文（见 pipeline 的 topicContext），切成一条条消息。没带就是 null。
 * 每条是「[时间] 谁：内容」；开头一行是说明，中间可能有「……（中间省略 N 条）」、最后可能有截图路径
 */
function ctxParts(prompt) {
  const i = (prompt || '').lastIndexOf(ASK_MARK);
  if (i < 0) return null;
  const c = prompt.slice(0, i).replace(/\n*---\s*$/, '').trim();
  return c.split(/\n\n(?=\[[^\]\n]*\] |……（中间省略|（里面的截图)/).map((part) => {
    const m = /^\[([^\]]*)\] ([^：\n]+)：([\s\S]*)$/.exec(part);
    return m ? { at: m[1], who: m[2], text: m[3].trim() } : { text: part.trim() };
  });
}


function renderSide(g, turns, session, t, same) {
  const s = $('side');
  const y = s.scrollTop;
  s.hidden = !sideOpen;
  s.textContent = '';
  if (!sideOpen) return;
  const j = g.at(-1), src = g.find((x) => !x.test);
  const sec = (title) => { const d = el('section', 'sblk'); d.appendChild(el('h3', null, title)); s.appendChild(d); return d; };
  const kv = (box, pairs) => {
    const dl = el('dl', 'kv');
    for (const [k, v] of pairs) if (v) { const dd = el('dd'); dd.append(v); dl.append(el('dt', null, k), dd); }
    box.appendChild(dl);
  };
  const asker = (x) => x.test ? (x.reply ? '网页追问' : '试跑') : x.who;

  const ended = g.filter((x) => x.endedAt);
  kv(sec('概要'), [
    ['会话', src ? (isP2P(src.chatId) ? '私聊 · ' : '') + chatName(src.chatId) : j.chatId ? chatName(j.chatId) : '试跑（没指定会话）'],
    ['入口', src ? (src.mode === 'bot' ? '@机器人（机器人回）' : '@我（以你的身份回）') : '网页'],
    ['提问', [...new Set(g.map(asker))].join('、')],
    ['开始', fullTime(g[0].startedAt)],
    ['最近', g.length > 1 && fullTime(j.startedAt)],
    ['总耗时', ended.length && dur(ended.reduce((n, x) => n + x.endedAt - x.startedAt, 0))],
  ]);

  // 跑过就说明当时是开着的：没单独勾的就是默认模板。模板、权限、API 是现在的配置，不一定是当时的
  const jm = cfg?.[j.mode === 'bot' ? 'bot' : 'user'];
  const rr = jm && (jm.resolved?.[j.chatId] || jm.fallback);
  const init = g.flatMap((x) => x.events).filter((e) => e.kind === 'init').at(-1);
  const uses = turns.map((tu) => usageOf(tu.events) || jobUse(tu.job)).filter(Boolean);
  const model = [...uses].reverse().find((u) => u.model)?.model || init?.model;
  let sid = null;
  if (session) {
    const id = session.replace(/^codex:/, '');
    sid = el('code', null, id);
    sid.title = '点一下复制，终端可用 ' + (session.startsWith('codex:') ? 'codex resume' : 'claude --resume') + ' 接着问';
    sid.onclick = () => copy(id, sid);
  }
  const bad = (init?.mcp || []).filter((m) => m.status !== 'connected' && m.status !== 'pending');
  kv(sec('运行环境'), [
    ['项目', tilde((t && t.cwd) || j.project || rr?.project || '')],
    ['执行器', session?.startsWith('codex:') ? 'Codex' : session ? 'Claude Code' : rr && agentName(rr)],
    ['模型', model || rr?.model],
    ['模板', rr?.template],
    ['权限', rr && permLabel(rr)],
    ['API', rr && apiText(rr)],
    ['session', sid],
    ['MCP', init?.mcp && (`${init.mcp.length - bad.length}/${init.mcp.length} 已连` + (bad.length ? '，没连上：' + bad.map((m) => m.name).join('、') : ''))],
  ]);

  // 上下文 = 最后一次调模型时喂进去的（输入 + 缓存），快满了就该新开一串了。Codex 暂时没有
  if (uses.length) kv(sec('用量'), [
    ['上下文', `${tok(uses.at(-1).ctx)} tokens（最近一次调模型）`],
    ['输出', `${tok(uses.reduce((n, u) => n + u.out, 0))} tokens（${uses.length} 问合计）`],
    ['工具', String(turns.reduce((n, x) => n + (x.events || []).filter((e) => e.kind === 'tool').length, 0)) + ' 次'],
  ]);

  // 每一问都有自己的卡片，这里看最新那张
  const cs = sec('飞书卡片');
  cs.firstChild.append(threadChip(j));
  if (j.posted || j.status === 'running') {
    const d = el('details', 'scard');
    d.appendChild(el('summary', null, '预览最新这张'));
    const load = () => { if (d.open && !d._done) { d._done = true; cardPreview(d, j); } };
    fold(d, 'card:' + j.id, false);
    d.addEventListener('toggle', load);
    load();
    cs.appendChild(d);
  }
  if (same) s.scrollTop = y;
}

/** 飞书卡片预览：跟群里真实发的走同一个 buildCard（服务端 /api/card），预览不会漂移 */
async function cardPreview(box, j) {
  let data;
  try {
    const r = await fetch('/api/card/' + encodeURIComponent(j.id));
    data = await r.json();
    if (!r.ok) throw new Error(data.error || '拉不到卡片');
  } catch (e) {
    box.appendChild(el('div', 'warn', '拉不到卡片：' + e.message));
    return;
  }
  if (!data.posted) box.appendChild(el('div', 'note', '还没发出去：判明这条确实要回才会发。下面是它现在攒着的样子。'));
  const stage = el('div', 'chatbg');
  stage.appendChild(feishuCard(data.card));
  box.appendChild(stage);
  box.appendChild(el('p', 'note', '近似预览，真机字体和间距会有出入。'));
  const raw = el('details', 'fraw');
  raw.appendChild(el('summary', null, '卡片 JSON'));
  const pre = el('pre'); pre.textContent = JSON.stringify(data.card, null, 2);
  raw.appendChild(pre);
  box.appendChild(raw);
}

function feishuCard(card) {
  const c = el('div', 'fcard');
  const h = el('div', 'fh');
  h.style.background = TPL_COLOR[card?.header?.template] || TPL_COLOR.grey;
  h.append(el('div', 'fh-t', card?.header?.title?.content || ''), el('div', 'fh-s', card?.header?.subtitle?.content || ''));
  const b = el('div', 'fb');
  for (const e of card?.body?.elements || []) {
    if (e.tag === 'markdown') b.appendChild(mdNode(e.content, e.text_size));
    else if (e.tag === 'collapsible_panel') {
      const d = el('details', 'fpanel');
      if (e.expanded) d.open = true;
      d.appendChild(el('summary', null, e.header?.title?.content || ''));
      const inner = el('div', 'fbody');
      for (const x of e.elements || []) if (x.tag === 'markdown') inner.appendChild(mdNode(x.content, x.text_size));
      d.appendChild(inner);
      b.appendChild(d);
    }
  }
  c.append(h, b);
  return c;
}

/** 卡片里我们自己发的这几个标签，预览得照原样渲染 —— 同时也是唯一放行的裸 HTML */
const TAG_MAP = { grey: '#8F959E', red: '#F54A45', blue: '#3370FF', green: '#34C724', orange: '#FF8800' };
function cardTag(t) {
  let m = /^<font color='([\w-]+)'>$/.exec(t);
  if (m) return `<span style="color:${TAG_MAP[m[1]] || TAG_MAP.grey}">`;
  if (t === '</font>') return '</span>';
  m = /^<text_tag color='([\w-]+)'>$/.exec(t);
  if (m) {
    const c = m[1] === 'red' ? '#F54A45' : '#646A73';
    const bg = m[1] === 'red' ? '#FBE7E5' : '#F0F1F2';
    return `<span style="background:${bg};color:${c};border-radius:3px;padding:0 5px;font-size:12px">`;
  }
  if (t === '</text_tag>') return '</span>';
  return '';
}
/*
 * marked 的浏览器构建由 /vendor/marked.js 发出来（web.ts 里直接读 node_modules），没有打包步骤。
 *
 * 裸 HTML 一律不放行 —— 正文是模型输出，而模型是被群消息牵着走的。这个页面背后是
 * POST /api/config 和 /api/run（全权限跑 CC），一句 <img onerror> 就能把"群里随便谁 @ 一下"
 * 升级成"改你的配置"。所以 html 渲染器直接返回空串。
 *
 * 唯一例外是我们自己拼进卡片里的 font / text_tag：那两个在 parse 之前就摘成占位符了 ——
 * marked 的标签名不认下划线，text_tag 会被它当普通文字转义掉，放行不了。
 */
/*
 * 链接 / 图片只放行 http(s) / mailto。marked 不管协议：`[看日志](javascript:…)` 原样出成可点的链接，
 * 一点就以本页的身份调 /api/config —— 跟裸 HTML 是同一个口子。返回 false = 交回 marked 默认渲染。
 */
const safeHref = (u) => /^(https?:|mailto:)/i.test(String(u ?? '').trim());
if (typeof marked !== 'undefined') marked.use({
  gfm: true, breaks: true,
  renderer: {
    html: () => '',
    link(t) { return safeHref(t.href) ? false : this.parser.parseInline(t.tokens); },
    image(t) { return safeHref(t.href) ? false : ''; },
  },
});

function mdNode(src, size) {
  const s = String(src ?? '');
  const n = el('div', 'md');
  if (size === 'notation') n.style.fontSize = '12px';
  // marked 没挂上（多半是忘了 npm i）就退成纯文本 —— 别让整个控制台白屏
  if (typeof marked === 'undefined') { n.style.whiteSpace = 'pre-wrap'; n.textContent = s; return n; }
  const held = [];
  n.innerHTML = marked
    .parse(s.replace(/<\/?(?:font|text_tag)[^>]*>/g, (m) => `\u0000${held.push(cardTag(m)) - 1}\u0000`))
    .replace(/\u0000(\d+)\u0000/g, (_, i) => held[+i]);
  return n;
}

/* ---------- SSE ---------- */
const es = new EventSource('/api/events');
es.onopen = () => { $('dot').className = 'dot on'; };
es.onerror = () => { $('dot').className = 'dot'; $('stat').textContent = '连接断开，重连中…'; };
es.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'snapshot') {
    jobs = new Map(m.jobs.map((j) => [j.id, j]));
    if (!sel || !jobs.has(sel)) sel = pick(m.jobs);
    renderAll();
  } else if (m.type === 'config') {
    const wasClaude = cfg?.usesClaude;
    cfg = m.config;
    if (cfg.usesClaude && !wasClaude) loadCC();
    paintCfgDot();
    if (pendingReload && draft) { pendingReload = false; const k = keepStat; openSettings(pane); keepStat = k; renderFoot(); }
    // 设置开着、没有没保存的改动：别处改了配置（比如向导拉完工作区自动指过去）就跟着刷新，不然下次保存会把它盖回去
    else if (draft && !changes().length) {
      const y = $('set-body').scrollTop; openSettings(pane); $('set-body').scrollTop = y;
      loadProjects().then(() => { if (draft && !isSent(pane) && !changes().length) rerenderPane(); });
    }
    else if (!draft && hashPane() !== undefined) openSettings(hashPane());
    if (draft) loadSetup();   // 模板换了执行器，向导要查的东西跟着变
    renderStatus(); loadChats(); renderAll();
  } else if (m.type === 'job') {
    const j = jobs.get(m.job.id) || { events: [] };
    Object.assign(j, m.job);
    jobs.set(j.id, j);
    if (!sel && (!grp || j.chatId === grp) && modeOk(j)) sel = j.id;
    // 跑完了：session 记录里这一问才完整，下次画的时候重新取（内存里的事件可能被截过）
    if (j.status !== 'running' && j.session && tx.get(j.session) !== 'loading') tx.delete(j.session);
    renderStatus(); renderGroups(); renderMid();
    if (inSel(j)) renderDetail();
  } else if (m.type === 'setup') {
    // 向导的检查项（装工具、测网关、扫码……）结束了：设置里的红点和每页顶上那条跟着刷新
    if (m.done && draft) loadSetup();
    if (m.section !== 'plugin') return;
    // 插件 / MCP 的进度（向导和设置共用这一路）：页头显示最新一条，结束了重拉状态
    ccSay(m.done ? (m.ok ? '✓ ' : '✗ ') + m.msg : m.msg, m.done && !m.ok);
    if (m.done) { loadCC(); if (ccAvail !== null) searchAvail(); if (ccSync?.available) loadSync(); }
  } else if (m.type === 'ev') {
    const j = jobs.get(m.id);
    if (!j) return;
    const itemId = m.ev.kind === 'text' && m.ev.itemId;
    const previous = itemId ? j.events.findIndex((e) => e.kind === 'text' && e.itemId === itemId) : -1;
    if (previous < 0) j.events.push(m.ev); else j.events[previous] = m.ev;
    if (!inSel(j)) return;
    const a = document.querySelector('#dbody .amsg[data-job="' + CSS.escape(j.id) + '"]');
    if (!a) return renderDetail();
    const box = $('dbody');
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
    appendEv(a, m.ev);
    if (near) box.scrollTop = box.scrollHeight;
  }
};

/** 默认选中：当前群最近的那条；没有就全部里最近的一条 */
function pick(list) {
  const pool = list.filter((j) => (!grp || j.chatId === grp) && modeOk(j));
  const from = pool.length ? pool : list;
  return from.length ? from.slice().sort((a, b) => b.startedAt - a.startedAt)[0].id : null;
}

function renderAll() { renderGroups(); renderMid(); renderDetail(); }
renderGFilters();

/** 一个入口管着哪些会话，一句话说清。私聊不能算进"群"里 —— 数字对不上人会以为哪儿配错了 */
function scopeText(m) {
  const ids = Object.keys(m.chats);
  const dm = ids.filter(isP2P).length;
  const g = m.allGroups ? '所有群' : `${ids.length - dm} 个群`;
  const p = m.allP2p ? '所有私聊' : `${dm} 个私聊`;
  return [g, p].filter((x) => !/^0 /.test(x)).join(' + ') || '一个会话都没开';
}

function renderStatus() {
  if (!cfg) return;
  const n = [...jobs.values()].filter((j) => !j.test).length;
  const user = cfg.user.on ? `@我：${scopeText(cfg.user)} · 每 ${Math.round(cfg.pollMs / 1000)} 秒` : '@我：关';
  const bot = cfg.bot.on ? `@机器人${cfg.bot.name ? '（' + cfg.bot.name + '）' : ''}：${scopeText(cfg.bot)} · 实时` : '@机器人：关';
  $('stat').textContent = $('stat').title = `${user} · ${bot} · ${n} 条作业`;
}

/* ---------- 会话列表 / 项目候选 ---------- */
async function loadChats() {
  if (!allChats) {
    try { const d = await fetch('/api/chats').then((r) => r.json()); allChats = d.chats ?? []; chatsErr = d.error || ''; }
    catch (e) { allChats = []; }
    renderGroups(); renderMid(); renderDetail();   // 详情头要靠会话列表认出私聊 / 群名
  }
  // 具体时间要一个个会话查，慢，所以先出名字，时间回来再补
  try {
    const a = (await fetch('/api/activity').then((r) => r.json())).activity;
    for (const c of allChats) c.lastAt = a[c.chatId] || null;
    renderGroups(); renderMid();
  } catch (e) { /* 没时间也能用 */ }
}
/** 项目候选：工作区（向导拉的 + 选过、登记进来的目录）。canPick = 弹得出系统的选目录框（桌面版、mac 上的命令行版） */
let projData = { workspaces: [], canPick: false, home: '' };
async function loadProjects() {
  try {
    const d = await fetch('/api/projects').then((r) => r.json());
    projData = { workspaces: d.workspaces || [], canPick: !!d.canPick, home: d.home || '' };
  } catch (e) { /* 拿不到就只能手填 */ }
}
loadProjects();

/* ---------- 设置 ---------- */
/*
 * 整页视图：左边「常规 / Claude Code / @我 / @机器人」+ 模板，右边编辑一个，底下一个保存条。改动先攒在 draft 里，保存才落盘
 * （Claude Code 页例外：点了就做，见 paneCC）。
 * 开着哪页记在 #settings / #settings/<模板名>，刷新还在（只 replaceState，不往历史里塞）。
 * 会话开不开、用哪个模板不在这儿 —— 在会话头上直接切，立刻生效（见 chatCtl）。
 */
// 不是模板的几页，键不会跟模板名撞；值是地址栏里的写法（#settings/~cc）
const GENERAL = '\u0000general', USER = '\u0000user', BOT = '\u0000bot', CC = '\u0000cc', LARK = '\u0000lark', REPO = '\u0000repo';
const CODEX = '\u0000codex';
/** API 来源并进了 Claude Code 页（只有 Claude 用它）。页面里「去 API」的链接都落到那儿 */
const API = CC;
const SENT = { [GENERAL]: '', [USER]: '~user', [BOT]: '~bot', [CC]: '~cc', [CODEX]: '~codex', [LARK]: '~lark', [REPO]: '~repo' };
/** 以前的地址：刷新 / 收藏夹里留着的还能落到对的页 */
const OLD_SENT = { '~api': CC, '~env': GENERAL };
/**
 * 嵌向导页的几页：向导那一段原样嵌进来（只要那一段、一直展开），点了立刻生效，跟底下的「保存」无关 ——
 * 都是 lark-cli / git 那边的状态，不在 config.json 里
 */
const FRAMES = {
  [LARK]: ['飞书', '/setup?embed&only=lark'],
  [REPO]: ['代码仓库', '/setup?embed&only=workspace'],
};
/**
 * 上手向导的检查项落在设置的哪一页：同一份状态（/api/setup/status），向导一段段走，设置里每页顶上列自己的、导航上标红点。
 * 「上手向导」不再单独占一页
 */
const CHECK_PANE = (sid, cid) => sid === 'lark' ? LARK : sid === 'workspace' ? REPO : sid === 'plugin' ? CC
  : sid === 'tools' ? ({ 'lark-cli': LARK, claude: CC, codex: CODEX, git: REPO })[cid]
  : sid === 'model' ? (cid === 'codex' ? CODEX : CC) : undefined;
const isSent = (k) => Object.hasOwn(SENT, k);
const MODE_PANE = { user: USER, bot: BOT };
/**
 * 三档权限，两个执行器一套说法。模板里各存各的字段（Claude 的 permissionMode / Codex 的 codexSandbox），
 * 换执行器时按档位带过去 —— 不然 Claude 那边选的「全放开」换成 Codex 就悄悄变成了只读，反过来更糟
 */
const LEVELS = [
  { label: '只读', claude: 'plan', codex: 'read-only', tip: ['只查不改：读代码、查日志，不动任何文件', 'Shell 命令只能读文件'] },
  { label: '可改', claude: 'auto', codex: 'workspace-write', tip: ['常规操作直接做，危险操作会被拦下', 'Shell 命令能改项目目录里的文件'] },
  { label: '全放开', claude: 'bypassPermissions', codex: 'danger-full-access', tip: ['不做任何确认，什么都能执行 —— 只给自己用的模板', '不进沙箱，什么命令都能跑 —— 只给自己用的模板'] },
];
const agentName = (t) => t?.agent === 'codex' ? 'Codex' : 'Claude Code';
const engineOf = (t) => t?.agent === 'codex' ? 'codex' : 'claude';
const permission = (t) => t?.agent === 'codex' ? (t.codexSandbox || 'read-only') : (t?.permissionMode || 'auto');
const levelOf = (t) => LEVELS.find((l) => l[engineOf(t)] === permission(t));
const permLabel = (t) => levelOf(t)?.label || permission(t);
const isReadOnly = (t) => levelOf(t) === LEVELS[0];

let draft = null;          // 设置里正在编的副本；null = 设置没开
let saved = null;          // draft 的已保存快照，算"改了哪些"用
let pane = GENERAL;        // 右边在编哪个：GENERAL 或模板名
let renamed = {};          // 新名 → 原名。模板改名后还能对得上原来那份，"改了几处"才不会数成两处
let judgeStash = {};       // 关掉判定时先把提示词收着，再打开还在
let advOpen = false;       // 「高级」展开着没有（重画时保持）
let pendingReload = false; // 刚保存：等服务端推回新配置后重建 draft（token 只剩 hasToken）
let keepStat = '';         // 保存后的提示，重建 draft 后接着显示

/** 服务端配置 → 可编辑的副本 */
const modeDraft = (m) => ({ on: m.on, defaultTemplate: m.defaultTemplate, chats: { ...m.chats }, allP2p: m.allP2p, allGroups: m.allGroups });
const editable = () => ({
  user: modeDraft(cfg.user), bot: modeDraft(cfg.bot),
  pollMs: cfg.pollMs, maxJobs: cfg.maxJobs,
  templates: JSON.parse(JSON.stringify(cfg.templates)),
  // from：存着的名字。令牌页面上拿不到，改了名服务端靠它找回来；token 没这个键 = 不改，'' = 清掉
  apis: cfg.apis.map((a) => ({ ...a, models: { ...a.models }, from: a.name })),
});

function openSettings(at) {
  const first = !draft;
  draft = editable();
  saved = JSON.parse(JSON.stringify(draft));
  renamed = {}; judgeStash = {};
  if (at !== undefined) pane = at;
  if (!isSent(pane) && !draft.templates[pane]) pane = draft.user.defaultTemplate;
  if (pane === CC && first) { loadCC(true); loadApiHealth(); loadSync(); }   // 配置推送也会走到这里重建 draft，别每次都让服务端重扫
  if (first) loadSetup();
  if (pane === CODEX && first) loadCodex();
  ensureModelList();
  $('settings').hidden = false; $('stage').hidden = true;
  $('btn-cfg').setAttribute('aria-pressed', 'true');
  if (first) { loadProjects().then(() => { if (draft && !isSent(pane)) rerenderPane(); }); $('set-body').scrollTop = 0; }
  renderSettings();
}
/** 有没保存的改动就先问一句。返回 false = 用户选了留下 */
const okToLeave = async () => !draft || !changes().length || ask('有改动还没保存，丢掉？', '丢掉');
async function closeSettings() {
  if (!(await okToLeave())) return;
  $('settings').hidden = true; $('stage').hidden = false; draft = null; keepStat = '';
  $('btn-cfg').setAttribute('aria-pressed', 'false');
  history.replaceState(null, '', location.pathname + location.search);
}
/** 位置写进地址栏：刷新回到同一页 */
function syncHash() {
  if (draft) history.replaceState(null, '', '#settings' + (pane === GENERAL ? '' : '/' + (SENT[pane] || encodeURIComponent(pane))));
}
/** 刷新进来带着 #settings：等第一份配置到了再开 */
function hashPane() {
  const m = /^#settings(?:\/(.*))?$/.exec(location.hash);
  if (!m) return undefined;
  const sent = Object.keys(SENT).find((k) => SENT[k] && SENT[k] === m[1]);
  if (sent) return sent;
  if (OLD_SENT[m[1]]) return OLD_SENT[m[1]];
  try { return m[1] ? decodeURIComponent(m[1]) : GENERAL; } catch (e) { return GENERAL; }
}

/** 跟已保存的比，改了哪些（GENERAL / USER / BOT / 模板名）。模板改名按原名比，新建 / 删除各算一处 */
function changes() {
  if (!draft) return [];
  const out = new Set();
  if (draft.maxJobs !== saved.maxJobs) out.add(GENERAL);
  if (JSON.stringify(draft.apis) !== JSON.stringify(saved.apis)) out.add(CC);
  for (const k of ['user', 'bot']) {
    const d = draft[k], s = saved[k];
    if (['on', 'allP2p', 'allGroups'].some((f) => d[f] !== s[f]) || (renamed[d.defaultTemplate] || d.defaultTemplate) !== s.defaultTemplate
      || (k === 'user' && draft.pollMs !== saved.pollMs)) out.add(MODE_PANE[k]);
  }
  const origins = new Set();
  for (const [name, t] of Object.entries(draft.templates)) {
    const from = renamed[name] || name;
    origins.add(from);
    if (from !== name || JSON.stringify(t) !== JSON.stringify(saved.templates[from])) out.add(name);
  }
  for (const name of Object.keys(saved.templates)) if (!origins.has(name)) out.add('删了「' + name + '」');
  return [...out];
}

function renderSettings() { renderNav(); renderPane(); renderFoot(); syncHash(); }
/** 任何一处改动都调它：只刷左栏的小圆点和底下的保存条，不重画正在打字的那块 */
function touch() { keepStat = ''; renderNav(); renderFoot(); if (draft?.templates[pane]) queueExplain(); }

function renderFoot() {
  const n = changes().length;
  const st = $('set-stat');
  if (keepStat && !n) { st.textContent = keepStat; st.className = keepStat.startsWith('⚠') ? 'warn' : 'note'; }
  else { st.textContent = n ? n + ' 处改动还没保存（' + SAVE_KEY + ' 保存）' : '改了会在这里提示，点「保存」才生效'; st.className = n ? 'dirty' : 'note'; }
  $('set-save').disabled = !n;
  $('set-revert').disabled = !n;
  // 嵌向导的页点了就生效，用不着保存条；别的页还有没保存的改动就留着，不然找不到地方存
  $('set-save').closest('footer').style.display = (FRAMES[pane] || pane === CODEX) && !n ? 'none' : '';
}

const SAVE_KEY = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘S' : 'Ctrl+S';
const usersOf = (name, k = 'user') => Object.entries(draft[k].chats).filter(([, t]) => (draft.templates[t] ? t : draft[k].defaultTemplate) === name).map(([id]) => id);
/** 两个入口加起来几个会话在用（同一个会话两边都开只算一个） */
const useCount = (name) => new Set([...usersOf(name), ...usersOf(name, 'bot')]).size;

function renderNav() {
  const nav = $('set-nav');
  nav.textContent = '';
  const dirty = new Set(changes());
  const back = el('button', 'navback', '← 返回');
  back.title = '回到主界面（Esc）'; back.onclick = closeSettings;
  nav.append(back, el('div', 'navtitle', '设置'));
  nav.appendChild(navItem(GENERAL, '常规', '', dirty.has(GENERAL)));
  nav.appendChild(navItem(LARK, '飞书', '应用 · 登录', false));
  nav.appendChild(navItem(REPO, '代码仓库', '工作区 · git', false));
  // 执行器：两边同一个结构（装没装、账号 / 连接、插件 / MCP）。没有模板在用的灰掉，它的问题也不标
  nav.appendChild(el('h4', null, '执行器'));
  const uses = (e) => Object.values(draft.templates).some((t) => engineOf(t) === e);
  const ccItem = navItem(CC, 'Claude Code', uses('claude') ? 'API · 插件' : '没有模板在用', dirty.has(CC));
  if (uses('claude') && cc?.needsAuth) { const c = el('span', 'navcount', String(cc.needsAuth)); c.title = cc.needsAuth + ' 个 MCP 要重新授权'; ccItem.appendChild(c); }
  ccItem.classList.toggle('dim', !uses('claude'));
  nav.appendChild(ccItem);
  const cxItem = navItem(CODEX, 'Codex', uses('codex') ? '连接 · MCP' : '没有模板在用', false);
  cxItem.classList.toggle('dim', !uses('codex'));
  nav.appendChild(cxItem);
  nav.appendChild(el('h4', null, '入口'));
  nav.appendChild(navItem(USER, '@我', draft.user.on ? '' : '关', dirty.has(USER)));
  nav.appendChild(navItem(BOT, '@机器人', draft.bot.on ? '' : '关', dirty.has(BOT)));
  nav.appendChild(el('h4', null, '模板'));
  for (const name of Object.keys(draft.templates)) {
    const n = useCount(name);
    const sub = [agentName(draft.templates[name]), name === draft.user.defaultTemplate && '@我默认', name === draft.bot.defaultTemplate && '@机器人默认', n && String(n)]
      .filter(Boolean).join(' · ');
    nav.appendChild(navItem(name, name, sub, dirty.has(name)));
  }
  const add = el('button', 'navadd', '+ 新建模板');
  add.onclick = () => {
    let n = '新模板', i = 2;
    while (draft.templates[n]) n = '新模板' + i++;
    draft.templates[n] = { permissionMode: 'plan' };   // 新模板先只读，确认好了再放开
    pane = n; renderSettings();
  };
  nav.appendChild(add);
}
function navItem(key, label, sub, dirty) {
  const b = el('button', 'navi');
  b.setAttribute('aria-current', String(pane === key));
  b.append(el('span', 'nm' + (dirty ? ' dirty' : ''), label));
  if (sub) b.append(el('small', null, sub));
  const bad = paneBad(key);
  if (bad.length) { const d = el('span', 'navbad'); d.title = bad.map((c) => c.label + '：' + (c.detail || '')).join('\n'); d.setAttribute('aria-label', bad.length + ' 项没弄好'); b.appendChild(d); }
  b.onclick = () => go(key);
  return b;
}
/** 设置里跳到某页（导航、页面里的「去 @我 页」之类的链接都走这里） */
function go(key) {
  if (key === CC && pane !== CC) { loadCC(true); loadApiHealth(); loadSync(); }
  if (key === CODEX && pane !== CODEX) loadCodex();
  pane = key; renderSettings(); $('set-body').scrollTop = 0;
}
/** 页面里的小链接：点了跳到设置的另一页 */
function goLink(text, key) { const a = el('button', 'link', text); a.type = 'button'; a.onclick = () => go(key); return a; }

function renderPane() {
  const head = $('set-head'), body = $('set-body');
  // 嵌的是向导页：配置推送也会走到这里重画，iframe 一挪就重载、填了一半的字会丢 —— 已经在了就别动
  if (FRAMES[pane] && body.querySelector('.envframe')?.dataset.pane === pane) return;
  head.textContent = ''; body.textContent = '';
  body.classList.toggle('is-frame', !!FRAMES[pane]);
  if (!isSent(pane) && !draft.templates[pane]) pane = GENERAL;
  if ([CC, CODEX, ...Object.keys(FRAMES)].includes(pane)) body.appendChild(strip(pane));
  if (pane === GENERAL) paneGeneral(head, body);
  else if (pane === USER) paneEntry(head, body, 'user');
  else if (pane === BOT) paneEntry(head, body, 'bot');
  else if (pane === CC) paneCC(head, body);
  else if (pane === CODEX) paneCodex(head, body);
  else if (FRAMES[pane]) paneFrame(head, body, ...FRAMES[pane]);
  else paneTemplate(head, body, pane);
}
/** 重画右边但别跳回顶上（开关判定之类会多出 / 少掉一块） */
function rerenderPane() { const y = $('set-body').scrollTop; renderPane(); $('set-body').scrollTop = y; }

/* 表单小件：标签在上，控件撑满 */
function blk(title, hintText) {
  const s = el('section', 'blk');
  const hd = el('div', 'blkh'); hd.appendChild(el('h3', null, title));
  s.appendChild(hd);
  if (hintText) s.appendChild(el('p', 'hint', hintText));
  return s;
}
function fi(label, control, hintText) {
  const single = !Array.isArray(control) && /^(INPUT|SELECT|TEXTAREA)$/.test(control.tagName);
  const w = el(single ? 'label' : 'div', 'fi');
  w.appendChild(el('span', 'lb', label));
  for (const c of [].concat(control)) w.appendChild(c);
  if (hintText != null) w.appendChild(typeof hintText === 'string' ? el('p', 'hint', hintText) : hintText);
  return w;
}
function sw(checked, text, onchange) {
  const l = el('label', 'switch');
  const i = el('input'); i.type = 'checkbox'; i.checked = !!checked;
  i.onchange = () => onchange(i.checked);
  l.append(i, el('span', 'knob'), el('span', null, text));
  return l;
}
function numIn(value, lo, hi, onset) {
  const n = el('input'); n.type = 'number'; n.min = lo; n.max = hi; n.value = value;
  n.oninput = () => { const v = Number(n.value); if (Number.isFinite(v) && n.value !== '') { onset(Math.min(hi, Math.max(lo, Math.round(v)))); touch(); } };
  return n;
}
/** 模型候选：服务端给的（别名 + ~/.claude/settings.json 里映射的模型名），手填完整模型名也行 */
function ensureModelList() {
  let dl = $('modellist');
  if (!dl) { dl = el('datalist'); dl.id = 'modellist'; document.body.appendChild(dl); }
  dl.textContent = '';
  for (const m of new Set(cfg.models || [])) { const o = el('option'); o.value = m; dl.appendChild(o); }
}
const setOr = (o, k, v) => { if (v === '' || v === undefined || v === null || (Array.isArray(v) && !v.length)) delete o[k]; else o[k] = v; };

function paneFrame(head, body, title, src) {
  head.append(el('h2', null, title), el('span', 'pmeta', '改了立刻生效'));
  const f = el('iframe', 'envframe'); f.src = src; f.title = title; f.dataset.pane = pane;
  body.appendChild(f);
}

function paneGeneral(head, body) {
  head.appendChild(el('h2', null, '常规'));

  const b1 = blk('同时跑', '@我 和 @机器人 共用：同时最多几个 Claude Code 在跑，多出来的排队。保存即生效。');
  const g1 = el('div', 'grid2');
  g1.append(fi('最多同时跑几个', numIn(draft.maxJobs, 1, 10, (v) => { draft.maxJobs = v; })));
  b1.appendChild(g1);
  body.appendChild(b1);

  const b3 = blk('服务', '端口在 config.json 里，改完要重启进程。');
  b3.querySelector('.hint').append('「我」在 ', goLink('飞书', LARK), ' 里换，API 来源在 ', goLink('Claude Code', CC), ' 里改（判定用来源 haiku 那档的模型）。');
  const dl = el('dl', 'kv');
  const apis = cfg.apis.length ? cfg.apis.map((a) => a.name).join(' → ') + '（按顺序，出问题换下一个）' : cfg.ownClaude;
  for (const [k, v] of [['监听', '127.0.0.1:' + cfg.port + '（只回环）'], ['我', cfg.me], ['API 来源', apis]]) dl.append(el('dt', null, k), el('dd', null, v));
  b3.appendChild(dl);
  body.appendChild(b3);
}

/**
 * @我 / @机器人 各一页：开关 → 回哪些会话 → 默认模板（→ @我 还有轮询）。
 * 两个入口流程不一样（谁的身份、怎么收消息），排查是同一套 CC、同一个模板库
 */
const ENTRY = {
  user: { title: '@我', what: '搜到 @我 的消息，以我本人回',
    how: '每隔一会儿全局搜一次「@我」。搜索索引有一两分钟延迟。私聊里也要 @你 才算 —— 不然你跟人聊天的每句话都会被它接过去。' },
  bot: { title: '@机器人', what: '有人 @机器人，以机器人回',
    how: '长连接收消息，秒级开跑，卡片流式打字。群里 @它、或者私聊它（不用 @）。追问：群里在话题里再 @它，私聊引用它的卡片。' },
};
/** 一个入口够得着的、不是只读的模板 → 谁能触发它。@我 的私聊默认只有对方和我，不算 */
function entryRisks(k, m) {
  const out = new Map();
  const add = (tn, who) => { if (draft.templates[tn] && !isReadOnly(draft.templates[tn])) out.set(tn, [...(out.get(tn) || []), who]); };
  if (m.allGroups) add(m.defaultTemplate, '所有群里 @' + (k === 'bot' ? '机器人' : '我') + ' 的人');
  if (m.allP2p && k === 'bot') add(m.defaultTemplate, '任何私聊机器人的人');
  const groups = Object.entries(m.chats).filter(([id]) => !isP2P(id));
  const byTpl = new Map();
  for (const [, tn] of groups) {
    const n = draft.templates[tn] ? tn : m.defaultTemplate;

let codexData, codexBusy = false, codexNote = '', codexError = '';
async function loadCodex(edit) {
  if (codexBusy) return;
  codexBusy = true; codexNote = ''; codexError = '';
  if (!edit) codexData = undefined;
  const paint = () => { if (draft && (pane === CODEX || draft.templates[pane]?.agent === 'codex')) rerenderPane(); };
  if (pane === CODEX) paint();
  const url = '/api/setup/codex/settings';
  try {

      if (r.error) throw new Error(r.error);
      codexNote = r.overridden ? '已写入，更高优先级的配置覆盖了这个值。' : '已保存';
    }
    const res = await fetch(url);
    if (res.status === 404) throw new Error('当前路由器还没有 Codex 配置接口，重启路由器后再刷新。');
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || '读取 Codex 配置失败');
    if (!Array.isArray(data.models)) throw new Error('当前路由器还没有模型列表接口，重启路由器后再刷新。');
    codexData = data;
  } catch (e) { codexError = e.message; }
  finally { codexBusy = false; paint(); }

function codexModelFields(model, effort, template, locked, change) {
  const models = codexData?.models || [];
  const ms = el('select'), es = el('select');
  ms.add(new Option(template ? '跟随 Codex 设置' : 'Codex 默认模型', ''));
  for (const m of models) ms.add(new Option(m.label, m.model));
  if (model && !models.some(m => m.model === model)) ms.add(new Option(model + '（当前配置）', model));
  ms.value = model;
  ms.disabled = locked || !models.length;
  function efforts(preserve) {
    const effective = ms.value || (template && codexData?.model);
    const m = models.find(m => effective ? m.model === effective : m.isDefault);
    const inherited = template && m?.efforts.includes(codexData?.effort) ? codexData.effort : m?.defaultEffort;
    es.replaceChildren(new Option((template ? '跟随 Codex 设置' : '模型默认') + (inherited ? '（' + inherited + '）' : ''), ''));
    for (const v of m?.efforts || []) es.add(new Option(v, v));
    if (preserve && effort && !m?.efforts.includes(effort)) {
      const old = new Option(effort + '（当前配置）', effort); old.disabled = true; es.add(old);
    }
    es.value = preserve || m?.efforts.includes(effort) ? effort : '';
    es.disabled = locked || (!m?.efforts.length && !effort);
  }
  efforts(true);
  ms.onchange = () => { efforts(false); effort = es.value; change(ms.value, effort); };
  es.onchange = () => { effort = es.value; change(ms.value, effort); };
  const g = el('div', 'grid2');
  g.append(fi(template ? '模型' : '默认模型', ms), fi('推理强度（effort）', es));
  return g;
}

async function searchAvail() {

function paintAvail(box) {

async function mcpLogin(name) {
  ccLogin[name] = { wait: true }; ccRender();
  const d = await post('/api/setup/mcp/login', { name }).catch((e) => ({ ok: false, error: e.message }));
  ccLogin[name] = d.url ? { url: d.url } : d.terminal ? { terminal: true } : d.opened ? {} : { error: d.error || '授权没起来' };
  loadCC();
}
async function mcpLogout(m) {
  if (!(await ask('退出 ' + m.label + ' 的登录？之后要用得重新授权。', '退出'))) return;
  const d = await post('/api/setup/mcp/logout', { name: m.name }).catch((e) => ({ ok: false, error: e.message }));
  if (!d.ok) ccLogin[m.name] = { error: d.error || '没退出成功' };

}

/**
 * 模板顶上「实际会怎么跑」：把页面上这份（没保存的也算）交给服务端，按真跑时同一套规则算出来 ——
 * 档位在每个来源上叫什么、哪个字段被谁盖了、判定打不打得到。页面不自己猜，免得跟真跑的对不上
 */
let explainT, explainSeq = 0;
function queueExplain() { clearTimeout(explainT); explainT = setTimeout(paintExplain, 250); }
async function paintExplain() {
  const name = pane, t = draft?.templates[name];
  if (!t || !$('explain')) return;
  const seq = ++explainSeq;
  const d = await post('/api/explain', { template: t, apis: draft.apis.map(({ hasToken, ...a }) => a) }).catch((e) => ({ error: e.message }));
  const box = $('explain');
  if (seq !== explainSeq || !box || pane !== name) return;
  box.textContent = '';
  if (d.error) { box.appendChild(el('dd', 'bad', '算不出来：' + d.error)); return; }
  for (const l of d.lines) {
    box.append(el('dt', l.bad ? 'bad' : null, l.k), el('dd', [l.code && 'code', l.bad && 'bad'].filter(Boolean).join(' ') || null, l.v));
  }
  // 判定那行也摆到「先判定」开关底下：开了却打不到的，在开的地方就看得见
  const jt = $('judge-target'), j = d.lines.find((l) => l.k === '判定');
  if (jt && j) { jt.textContent = t.judge ? j.v : ''; jt.className = 'hint' + (j.bad ? ' bad' : ''); jt.hidden = !t.judge; }
  const tr = $('explain-try');
  if (tr) { const dirty = changes().length; tr.disabled = dirty > 0; tr.title = dirty ? '有改动没保存：先保存，试跑用的是保存过的配置' : '按这个模板真跑一次，卡片发给你自己'; }
}

/**
 * 项目选择器：一张卡片（文件夹名 + 路径），点开是菜单：在 Finder 里选… → 用过的目录（自己选的能 × 掉）→ 粘贴路径。
 * 一个都没用过、又弹得出系统框：点卡片直接弹 Finder，不绕菜单。
 * 选过的目录登记成工作区，下次在哪儿选都在「用过的」里。↑↓ 在菜单里挪，Esc 收起（不冒泡，免得把整个设置页也关了）。
 * empty = 没选时卡片上写什么（试跑那里是「跟模板走」）
 */
const FOLDER_SVG = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2H16a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const IS_MAC = /Mac/.test(navigator.platform);
const folderIcon = () => { const s = el('span', 'pick-ic'); s.innerHTML = FOLDER_SVG; return s; };
const tilde = (p) => projData.home && (p === projData.home || p.startsWith(projData.home + '/')) ? '~' + p.slice(projData.home.length) : p;
function projPicker(value, onset, empty = '还没选项目') {
  const w = el('div', 'pick');
  const card = el('button', 'pick-card'); card.type = 'button'; card.setAttribute('aria-haspopup', 'menu'); card.setAttribute('aria-expanded', 'false');
  w.appendChild(card);
  let menu = null;

  const paint = () => {
    const ws = projData.workspaces.find((x) => x.path === value);
    const txt = el('span', 'pick-txt');
    if (value) txt.append(el('b', null, ws ? ws.name : projName(value)), el('small', null, tilde(value)));
    else txt.append(el('span', 'pick-empty', empty));
    card.replaceChildren(folderIcon(), txt, el('span', 'pick-chg', value ? '更换' : '选择'));
    card.title = value;
    card.classList.toggle('is-empty', !value);
  };
  // 选定的目录顺手登记成工作区。登记过的、不存在的、重名的后端会拒，不影响这里用它
  // ponytail: 跟已有工作区重名（比如两个都叫 order）就不登记了，要的话后端自动加后缀
  const register = async (p) => {
    if (!p || projData.workspaces.some((x) => x.path === p)) return;
    await post('/api/setup/workspace/add-existing', { path: p }).catch(() => {});
    await loadProjects();
    paint();
  };
  const set = (v) => { value = v; paint(); onset(v); close(); register(v); };
  const finder = async () => {
    close();
    const d = await post('/api/pick-folder', {}).catch(() => ({}));
    if (d && d.path) set(d.path);
    card.focus();
  };
  const close = () => {
    if (!menu) return;
    menu.remove(); menu = null;
    card.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
  };
  const outside = (e) => { if (!w.contains(e.target)) close(); };
  const item = (cls, parts, pick) => {
    const b = el('button', 'pick-it' + (cls ? ' ' + cls : '')); b.type = 'button'; b.setAttribute('role', 'menuitem');
    b.append(...parts); b.onclick = pick;
    return b;
  };
  const draw = () => {
    menu.textContent = '';
    if (projData.canPick) menu.appendChild(item('pick-finder', [folderIcon(), IS_MAC ? '在 Finder 里选文件夹…' : '选择文件夹…'], finder));
    if (projData.workspaces.length) {
      menu.appendChild(el('div', 'pick-h', '用过的'));
      for (const x of projData.workspaces) {
        const row = el('div', 'pick-row');
        row.appendChild(item(x.path === value ? 'is-cur' : '', [el('b', null, x.name), el('small', null, tilde(x.path))], () => set(x.path)));
        if (!x.managed) {
          const del = el('button', 'pick-x', '×'); del.type = 'button';
          del.title = '从列表里去掉（不删文件）'; del.setAttribute('aria-label', '从列表里去掉 ' + x.name);
          del.onclick = async () => {
            const d = await post('/api/setup/workspace/forget', { workspace: x.name }).catch((e) => ({ error: e.message }));
            if (d && d.error) return alert(d.error);
            await loadProjects();
            if (menu) { draw(); menu.querySelector('button')?.focus(); }
          };
          row.appendChild(del);
        }
        menu.appendChild(row);
      }
    }
    // 手填：弹不出系统框（Linux / Windows 上的命令行版），或者路径刚好在剪贴板里
    const path = el('input', 'pick-path'); path.placeholder = projData.canPick ? '或者粘贴一个目录路径，回车' : '粘贴一个目录路径，回车';
    path.spellcheck = false; path.setAttribute('aria-label', '目录路径');
    path.onkeydown = (e) => { if (e.key === 'Enter' && path.value.trim()) { e.preventDefault(); set(path.value.trim()); card.focus(); } };
    menu.appendChild(path);
  };
  const open = () => {
    menu = el('div', 'pick-menu'); menu.setAttribute('role', 'menu');
    w.appendChild(menu); draw();
    card.setAttribute('aria-expanded', 'true');
    document.addEventListener('mousedown', outside, true);
    (menu.querySelector('.is-cur') || menu.querySelector('button, input')).focus();
  };
  card.onclick = () => {
    if (menu) close();
    else if (projData.canPick && !projData.workspaces.length) finder();
    else open();
  };
  w.onkeydown = (e) => {
    if (!menu) return;
    if (e.key === 'Escape') { e.stopPropagation(); close(); card.focus(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const all = [...menu.querySelectorAll('button.pick-it, input')];
      const i = all.indexOf(document.activeElement);
      e.preventDefault();
      all[(i + (e.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length]?.focus();
    }
  };
  paint();
  return w;
}

/** 离开这一页（去向导之类）：设置里有没保存的改动先问 */
async function leave(url) { if (await okToLeave()) location.href = url; }

async function deleteTemplate(name) {
  if (Object.keys(draft.templates).length <= 1) return alert('至少要留一个模板');
  const users = usersOf(name);
  if (users.length && !(await ask(users.length + ' 个会话在用它，删了会改用默认模板。确定？', '删掉'))) return;
  delete draft.templates[name];
  delete renamed[name];
  for (const id of users) draft.user.chats[id] = '';
  if (draft.user.defaultTemplate === name) draft.user.defaultTemplate = Object.keys(draft.templates)[0];
  for (const [id, t] of Object.entries(draft.bot.chats)) if (t === name) delete draft.bot.chats[id];
  if (draft.bot.defaultTemplate === name) draft.bot.defaultTemplate = Object.keys(draft.templates)[0];
  pane = draft.user.defaultTemplate;
  renderSettings();
}
function renameTemplate(from, to, input) {
  if (!to || to === from) { input.value = from; return; }
  if (draft.templates[to]) { input.value = from; return alert('已经有叫「' + to + '」的模板了'); }
  // 保持在列表里的位置
  draft.templates = Object.fromEntries(Object.entries(draft.templates).map(([k, v]) => [k === from ? to : k, v]));
  const origin = renamed[from] || from;
  delete renamed[from];
  if (origin !== to) renamed[to] = origin;
  for (const m of [draft.user, draft.bot]) {
    for (const [id, t] of Object.entries(m.chats)) if (t === from) m.chats[id] = to;
    if (m.defaultTemplate === from) m.defaultTemplate = to;
  }
  if (from in judgeStash) { judgeStash[to] = judgeStash[from]; delete judgeStash[from]; }
  pane = to;
  renderSettings();
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}

/* ---------- 会话头上：开不开 + 用哪个模板，切了立刻生效 ---------- */
function chatCtl(chatId) {
  const wrap = el('div');
  for (const [mode, name] of MODES) if (cfg?.[mode].on) wrap.appendChild(modeRow(chatId, mode, name));
  if (!wrap.childNodes.length) {
    const p = el('p', 'note', '两个入口都关着：');
    const a = el('button', 'link', '去设置里打开'); a.onclick = () => openSettings(USER);
    p.appendChild(a); wrap.appendChild(p);

/** 一个入口在这个会话上：开不开 + 用哪个模板。被「所有私聊 / 所有群」盖住的开关是灰的 */
function modeRow(chatId, mode, name) {
  const m = cfg[mode];
  const row = el('div', 'chatctl');
  const all = covered(m, chatId);
  const on = chatId in m.chats || all;
  const msg = el('span', 'warn');
  const send = async (body) => {
    msg.textContent = '';
    const d = await post('/api/chat', { chatId, mode, ...body }).catch((e) => ({ error: e.message }));
    if (!d.ok) { msg.textContent = d.error; renderMid(); setTimeout(() => { msg.textContent = d.error; }, 0); }
    // 成功就等服务端推新配置过来重画
  };
  const s = sw(on, name + ' ' + (on ? '自动回' : '没开自动回'), (v) => send({ on: v }));
  if (all) {
    s.querySelector('input').disabled = true;
    s.title = `${name} 开了「所有${isP2P(chatId) ? '私聊' : '群'}都回」，点这里去设置 → ${name} 里改`;
    s.onclick = () => openSettings(MODE_PANE[mode]);
  }
  row.appendChild(s);
  if (!all) row.title = `有人 ${name === '@我' ? '@你' : '@机器人'} 就自动跑。切了立刻生效`;
  if (on) {
    const sel = el('select'); sel.setAttribute('aria-label', name + ' 用哪个模板');
    for (const n of Object.keys(cfg.templates)) {
      const o = el('option'); o.value = n; o.textContent = n + (n === m.defaultTemplate ? '（默认）' : ''); sel.appendChild(o);
    }
    sel.value = m.resolved?.[chatId]?.template || m.defaultTemplate;
    sel.onchange = () => send({ on: true, template: sel.value });
    const edit = el('button', 'ghost', '编辑'); edit.title = '编辑这个模板';
    edit.onclick = () => openSettings(sel.value);
    const tpl = el('span', 'chatctl-tpl');
    tpl.append(sel, edit);
    row.appendChild(tpl);
  }
  row.appendChild(msg);
  return row;
}

/* ---------- 对话底下的输入框：在这一串的 session 上接着问 ---------- */
let cFor = null;   // 输入框现在对着哪一串：{ g, session, src }
let cErr = '';     // 上一次发送的报错，换一串就清掉
try { $('c-reply').checked = localStorage.getItem('lcr.reply') === '1'; } catch (e) {}
function renderComposer(g) {
  const box = $('composer');
  const session = g.find((j) => j.session)?.session;
  box.hidden = !session;
  if (box.hidden) { cFor = null; return; }
  // 卡片要回飞书的话，回在这一串最近一条飞书消息底下（群里进原话题，私聊引用它），用它当时的身份
  const src = [...g].reverse().find((j) => !j.test && /^om_/.test(j.id));
  const busy = g.some((j) => j.status === 'running');
  if (cFor?.session !== session) cErr = '';
  cFor = { g, session, src };
  $('c-replybox').hidden = !src;
  if (src) $('c-reply-t').textContent = `卡片回到飞书${isP2P(src.chatId) ? '原私聊' : '原话题'}（${src.mode === 'bot' ? '机器人' : '你本人'}发）`;
  $('c-go').disabled = busy;
  $('c-stat').textContent = $('c-stat').title = busy ? '还在跑，跑完再接着问' : cErr || (src && $('c-reply').checked ? '' : '卡片只发给你自己');
}
$('c-reply').onchange = () => {
  try { localStorage.setItem('lcr.reply', $('c-reply').checked ? '1' : '0'); } catch (e) {}
  if (cFor) renderComposer(cFor.g);
};
async function sendFollow() {
  const prompt = $('c-q').value.trim();
  if (!cFor || !prompt || $('c-go').disabled) return;
  const { g, session, src } = cFor;
  const from = src || g.at(-1);
  const reply = !!src && $('c-reply').checked;
  if (reply && !isP2P(src.chatId) && !(await ask(`在「${chatName(src.chatId)}」的原话题里${src.mode === 'bot' ? '以机器人身份' : '以你的身份'}回这一问？群里的人都看得到`, '发送'))) return;
  const t = tx.get(session);
  $('c-go').disabled = true; $('c-stat').textContent = '启动中…';
  // 项目用 session 记录里的 cwd：claude 的 session 跟目录走，换了目录 --resume 找不到
  const d = await post('/api/run', {
    mode: from.mode === 'bot' ? 'bot' : 'user', chatId: from.chatId || '', project: (t && t.cwd) || from.project || '',
    prompt, resume: session, replyTo: reply ? src.id : undefined,
  }).catch((e) => ({ error: e.message }));
  if (d.error) { cErr = d.error; $('c-stat').textContent = $('c-stat').title = d.error; $('c-go').disabled = false; return; }
  $('c-q').value = ''; cErr = '';
  sel = d.id; renderAll();
}
$('c-go').onclick = sendFollow;
$('c-q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendFollow(); }
});
