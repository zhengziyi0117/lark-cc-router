<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2714D"/>
      <stop offset="1" stop-color="#B4532F"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <filter id="bsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A2412" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- mac 图标网格：824 的圆角方块居中，四周留 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <!-- 对话气泡：左下角一个小尾巴 -->
  <g filter="url(#bsh)">
    <path fill="#FAF9F5" d="M372 268h280c88 0 140 52 140 140v168c0 88-52 140-140 140H452l-118 88c-14 10-30 2-28-14l12-84c-60-18-86-62-86-130V408c0-88 52-140 140-140z"/>
  </g>
  <text x="512" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="330" fill="#C15F3C">@</text>
</svg>
