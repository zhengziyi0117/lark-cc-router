/**
 * 项目选择器：输入框（手填也行）+「选择」下拉：工作区（名字 + 路径）→ 选择文件夹…（只有桌面版）。
 * 下拉里按输入过滤；↑↓ 挑、回车选、Esc 收起（不冒泡，免得把整个设置页也关了）。
 */
function projPicker(value, onset) {
  const w = el('div', 'pick');
  const inp = el('input'); inp.value = value; inp.placeholder = '选一个工作区，或填目录路径'; inp.setAttribute('aria-label', '项目');
  inp.setAttribute('role', 'combobox'); inp.setAttribute('aria-expanded', 'false'); inp.autocomplete = 'off'; inp.spellcheck = false;
  const tog = el('button', null, '选择'); tog.type = 'button'; tog.setAttribute('aria-haspopup', 'listbox');
  w.append(inp, tog);
  let menu = null, items = [], hl = -1, filter = '';

  // 选定的目录顺手登记成工作区：别的模板的下拉里、下次也能直接挑。登记过的、不存在的、重名的后端会拒，不影响这个模板用它
  // ponytail: 跟已有工作区重名（比如两个都叫 order）就不登记了，要的话后端自动加后缀
  const register = async (p) => {
    if (!p || projData.workspaces.some((x) => x.path === p)) return;
    await post('/api/setup/workspace/add-existing', { path: p }).catch(() => {});
    await loadProjects();
  };
  const set = (v) => { inp.value = v; onset(v.trim()); close(); register(v.trim()); };
  const close = () => {
    if (!menu) return;
    menu.remove(); menu = null; items = []; hl = -1;
    inp.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
  };
  const outside = (e) => { if (!w.contains(e.target)) close(); };
  const move = (d) => {
    if (!items.length) return;
    hl = (hl + d + items.length) % items.length;
    items.forEach((b, i) => b.classList.toggle('is-hl', i === hl));
    items[hl].scrollIntoView({ block: 'nearest' });
  };
  const item = (cls, parts, pick) => {
    const b = el('button', 'pick-it' + (cls ? ' ' + cls : '')); b.type = 'button'; b.setAttribute('role', 'option');
    b.append(...parts);
    b.onmousedown = (e) => e.preventDefault();   // 别让输入框失焦
    b.onclick = pick;
    items.push(b);
    return b;
  };
  const draw = () => {
    menu.textContent = ''; items = []; hl = -1;
    const kw = filter.trim().toLowerCase();
    const hit = (s) => !kw || s.toLowerCase().includes(kw);
    const cur = inp.value.trim();
    const ws = projData.workspaces.filter((x) => hit(x.name + ' ' + x.path));
    menu.appendChild(el('div', 'pick-h', '工作区'));
    if (ws.length) for (const x of ws) menu.appendChild(item(x.path === cur ? 'is-cur' : '', [el('b', null, x.name), el('small', null, x.path)], () => set(x.path)));
    else if (!projData.workspaces.length) {
      const n = el('div', 'pick-none'); const a = el('a', null, '去「环境」拉一个'); a.href = '#settings/~env';
      a.onclick = (e) => { e.preventDefault(); go(ENV); };
      n.append('还没有工作区。', a); menu.appendChild(n);
    } else menu.appendChild(el('div', 'pick-none', '没有匹配的工作区'));
    if (projData.canPick) {
      const act = el('div', 'pick-act');
      act.appendChild(item('', ['选择文件夹…'], async () => {
        close();
        const d = await post('/api/pick-folder', {}).catch(() => ({}));
        if (d && d.path) set(d.path);
      }));
      menu.appendChild(act);
    }
  };
  const open = () => {
    if (menu) return;
    filter = '';
    menu = el('div', 'pick-menu'); menu.setAttribute('role', 'listbox');
    w.appendChild(menu); draw();
    inp.setAttribute('aria-expanded', 'true');
    document.addEventListener('mousedown', outside, true);
  };
  tog.onclick = () => { if (menu) close(); else { open(); inp.focus(); } };
  inp.oninput = () => { onset(inp.value.trim()); if (menu) { filter = inp.value; draw(); } };
  inp.onchange = () => register(inp.value.trim());   // 手填的：填完离开输入框才算定了，不是每敲一个字都登记
  inp.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!menu) open(); move(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter' && menu && hl >= 0) { e.preventDefault(); items[hl].click(); }
    else if (e.key === 'Escape' && menu) { e.stopPropagation(); close(); }
  };
  return w;
}

/** 离开这一页（去向导之类）：设置里有没保存的改动先问 */
function leave(url) { if (okToLeave()) location.href = url; }

function deleteTemplate(name) {
  if (Object.keys(draft.templates).length <= 1) return alert('至少要留一个模板');
  const users = usersOf(name);
  if (users.length && !confirm(users.length + ' 个会话在用它，删了会改用默认模板。确定？')) return;
  delete draft.templates[name];
  delete renamed[name];
  for (const id of users) draft.user.chats[id] = '';
  if (draft.user.defaultTemplate === name) draft.user.defaultTemplate = Object.keys(draft.templates)[0];
  for (const [id, t] of Object.entries(draft.bot.chats)) if (t === name) delete draft.bot.chats[id];
  if (draft.bot.defaultTemplate === name) draft.bot.defaultTemplate = Object.keys(draft.templates)[0];
  pane = draft.user.defaultTemplate;
  renderSettings();
}
function renameTemplate(from, to, input) {
  if (!to || to === from) { input.value = from; return; }
  if (draft.templates[to]) { input.value = from; return alert('已经有叫「' + to + '」的模板了'); }
  // 保持在列表里的位置
  draft.templates = Object.fromEntries(Object.entries(draft.templates).map(([k, v]) => [k === from ? to : k, v]));
  const origin = renamed[from] || from;
  delete renamed[from];
  if (origin !== to) renamed[to] = origin;
  for (const m of [draft.user, draft.bot]) {
    for (const [id, t] of Object.entries(m.chats)) if (t === from) m.chats[id] = to;
    if (m.defaultTemplate === from) m.defaultTemplate = to;
  }
  if (from in judgeStash) { judgeStash[to] = judgeStash[from]; delete judgeStash[from]; }
  pane = to;
  renderSettings();
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

}

  if (draft) renderFoot();
};

/* ---------- 会话头上：开不开 + 用哪个模板，切了立刻生效 ---------- */
function chatCtl(chatId) {
  const wrap = el('div');
  for (const [mode, name] of MODES) if (cfg?.[mode].on) wrap.appendChild(modeRow(chatId, mode, name));
  if (!wrap.childNodes.length) {
    const p = el('p', 'note', '两个入口都关着：');
    const a = el('button', 'link', '去设置里打开'); a.onclick = () => openSettings(USER);
    p.appendChild(a); wrap.appendChild(p);
  }
  return wrap;
}

/** 一个入口在这个会话上：开不开 + 用哪个模板。被「所有私聊 / 所有群」盖住的开关是灰的 */
function modeRow(chatId, mode, name) {
  const m = cfg[mode];
  const row = el('div', 'chatctl');
  const all = covered(m, chatId);
  const on = chatId in m.chats || all;
  const msg = el('span', 'warn');
  const send = async (body) => {
    msg.textContent = '';
    const d = await post('/api/chat', { chatId, mode, ...body }).catch((e) => ({ error: e.message }));
    if (!d.ok) { msg.textContent = d.error; renderMid(); setTimeout(() => { msg.textContent = d.error; }, 0); }
    // 成功就等服务端推新配置过来重画
  };
  const s = sw(on, name + ' ' + (on ? '自动回' : '没开自动回'), (v) => send({ on: v }));
  if (all) {
    s.querySelector('input').disabled = true;
    s.title = `${name} 开了「所有${isP2P(chatId) ? '私聊' : '群'}都回」，点这里去设置 → ${name} 里改`;
    s.onclick = () => openSettings(MODE_PANE[mode]);
  }
  row.appendChild(s);
  if (!all) row.title = `有人 ${name === '@我' ? '@你' : '@机器人'} 就自动跑。切了立刻生效`;
  if (on) {
    const sel = el('select'); sel.setAttribute('aria-label', name + ' 用哪个模板');
    for (const n of Object.keys(cfg.templates)) {
      const o = el('option'); o.value = n; o.textContent = n + (n === m.defaultTemplate ? '（默认）' : ''); sel.appendChild(o);
    }
    sel.value = m.resolved?.[chatId]?.template || m.defaultTemplate;
    sel.onchange = () => send({ on: true, template: sel.value });
    const edit = el('button', 'ghost', '编辑'); edit.title = '编辑这个模板';
    edit.onclick = () => openSettings(sel.value);
    const tpl = el('span', 'chatctl-tpl');
    tpl.append(sel, edit);
    row.appendChild(tpl);
  }
  row.appendChild(msg);
  return row;
}

/* ---------- 试跑 ---------- */
let runResume = '';
function openRun(job, resume) {
  const s = $('r-chat');
  s.textContent = '';
  const none = el('option'); none.value = ''; none.textContent = '（不指定，用默认配置）';
  s.appendChild(none);
  for (const id of Object.keys(cfg.user.chats)) { const o = el('option'); o.value = id; o.textContent = chatName(id); s.appendChild(o); }
  s.value = job && job.chatId in cfg.user.chats ? job.chatId : '';
  $('r-proj').value = (job && job.project) || resolvedFor('user', s.value)?.project || '';
  $('r-q').value = job ? job.q : '';
  runResume = resume || '';
  $('run-stat').textContent = '';
  $('run').hidden = false; $('scrim').hidden = false;
  echoRun();
  $('r-q').focus();
}
function closeRun() { $('run').hidden = true; $('scrim').hidden = true; }

/** 跑之前先把"这句话会被怎么处理"摆出来 —— 路由、权限、提示词来源 */
function echoRun() {
  const chatId = $('r-chat').value;
  const r = resolvedFor('user', chatId);
  const proj = $('r-proj').value.trim() || r?.project || '';
  const e = $('r-echo');
  e.textContent = '';
  const line = (k, v, cls) => { const d = el('div'); d.append(el('b', null, k + '：'), el('span', cls, v)); return d; };
  e.append(
    line('项目', proj || '（空）', proj ? '' : 'no'),
    line('权限', permLabel(r?.permissionMode)),
    line('模型', r?.model || 'claude 默认'),
    line('判定', r?.judge ? '先判定要不要回' : '直接回'),
    line('提示词', r?.prompt ? `模板「${r.template}」自己那段` : `模板「${r?.template || '?'}」没设（不加系统提示词）`),
  );
  if (!chatId) e.appendChild(el('div', 'note', '没指定会话：用默认模板，项目也由它决定 —— 底下那个项目框是手填的覆盖。'));
  else if (!r) e.appendChild(el('div', 'note', '这个会话没开自动回 —— 试跑照样能跑，但真消息不会触发。'));
  const rb = $('r-resumebox');
  if (runResume) {
    rb.hidden = false;
    rb.textContent = '';
    rb.append(document.createTextNode('在 session '), el('code', null, runResume), document.createTextNode(' 上接着问（--resume，项目要跟原来一致）。'));
    const x = el('button', 'ghost', '不续了');
    x.onclick = () => { runResume = ''; echoRun(); };
    rb.appendChild(x);
  } else rb.hidden = true;
}
$('btn-run').onclick = () => openRun();
$('run-close').onclick = closeRun;
for (const id of ['r-chat', 'r-proj']) $(id).addEventListener('input', echoRun);
$('r-chat').addEventListener('change', () => {
  $('r-proj').value = resolvedFor('user', $('r-chat').value)?.project || '';
  echoRun();
});
$('run-go').onclick = async () => {
  const body = {
    chatId: $('r-chat').value, project: $('r-proj').value.trim(),
    prompt: $('r-q').value.trim(), resume: runResume || undefined,
  };
  if (!body.prompt) { $('run-stat').textContent = '先写一句要问的话'; return; }
  $('run-go').disabled = true; $('run-stat').textContent = '启动中…';
  const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  $('run-go').disabled = false;
  if (!r.ok) { $('run-stat').textContent = d.error || '起不来'; return; }
  grp = body.chatId || grp; sel = d.id; view = 'trace'; closeRun(); renderAll();
};

$('run-judge').onclick = async () => {
  const body = { chatId: $('r-chat').value, prompt: $('r-q').value.trim(), p2p: isP2P($('r-chat').value) };
  if (!body.prompt) { $('run-stat').textContent = '先写一句要问的话'; return; }
  $('run-judge').disabled = true; $('run-stat').textContent = '判定中…';
  const r = await fetch('/api/judge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  $('run-judge').disabled = false;
  $('run-stat').textContent = !r.ok ? (d.error || '判定失败') : d.none ? '这个会话的模板没开「先判定」—— 会直接交给 Claude Code' : `${d.label}：${d.reason}`;
};

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('run').hidden) closeRun(); else if (!$('settings').hidden) closeSettings(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 's' && draft) { e.preventDefault(); if (!$('set-save').disabled) $('set-save').click(); return; }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); $('gsearch').focus(); }
});
$('gsearch').addEventListener('input', () => { gq = $('gsearch').value.trim().toLowerCase(); renderGroups(); });

/* ---------- 左栏筛选 ---------- */
function renderGFilters() {
  $('f-hasjobs').setAttribute('aria-pressed', String(gHasJobs));
  const seg = $('gkind');
  seg.textContent = '';
  for (const [k, label] of [['all', '全部'], ['group', '群'], ['p2p', '私聊']]) {
    const b = el('button', null, label);
    b.setAttribute('aria-pressed', String(gKind === k));
    b.onclick = () => { gKind = k; renderGFilters(); renderGroups(); };
    seg.appendChild(b);
  }
}
$('f-hasjobs').onclick = () => {
  gHasJobs = !gHasJobs;
  try { localStorage.setItem('lcr.hasJobs', gHasJobs ? '1' : ''); } catch (e) {}
  renderGFilters(); renderGroups();
};

/* ---------- 三栏拖宽 ---------- */
// 宽度只是这台机器上的偏好，存 localStorage（读写都可能抛：隐私模式、禁了站点数据）
const COLS = { rail: { min: 176, max: 384 }, mid: { min: 208, max: 512 } };   // px；另有 CSS 里的占窗宽上限
let colW = {};
try { colW = JSON.parse(localStorage.getItem('lcr.cols')) || {}; } catch (e) {}
function setCol(k, px) {
  if (px == null) delete colW[k];
  else colW[k] = Math.round(Math.min(Math.max(px, COLS[k].min), COLS[k].max));
  paintCols();
  try { localStorage.setItem('lcr.cols', JSON.stringify(colW)); } catch (e) {}
}
function paintCols() {
  for (const k in COLS) {
    if (colW[k]) $('stage').style.setProperty('--w-' + k, colW[k] + 'px'); else $('stage').style.removeProperty('--w-' + k);
    const g = document.querySelector(`.stage-grip[data-col=${k}]`);
    g.setAttribute('aria-valuemin', COLS[k].min); g.setAttribute('aria-valuemax', COLS[k].max);
    g.setAttribute('aria-valuenow', Math.round(document.querySelector('.col.' + k).getBoundingClientRect().width));
  }
}
for (const g of document.querySelectorAll('.stage-grip')) {
  const k = g.dataset.col;
  const width = () => document.querySelector('.col.' + k).getBoundingClientRect().width;
  g.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    g.classList.add('stage-grip-on'); $('stage').classList.add('stage-drag');
    const x0 = e.clientX, w0 = width();
    g.onpointermove = (ev) => setCol(k, w0 + ev.clientX - x0);
    g.onpointerup = g.onpointercancel = () => {
      g.onpointermove = g.onpointerup = g.onpointercancel = null;
      g.classList.remove('stage-grip-on'); $('stage').classList.remove('stage-drag');
    };
  };
  g.ondblclick = () => setCol(k, null);
  // 键盘：← → 一次 16px，按住 Shift 一次 48px；Home 恢复默认
  g.onkeydown = (e) => {
    const d = { ArrowLeft: -16, ArrowRight: 16 }[e.key];
    if (d) { e.preventDefault(); setCol(k, width() + d * (e.shiftKey ? 3 : 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setCol(k, null); }
  };
}
paintCols();
addEventListener('resize', paintCols);   // 窗口一缩，CSS 的占窗宽上限可能生效，读屏报的宽度跟着更新
</script>
</body>
