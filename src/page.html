/* ---------- 试跑 ---------- */
let runMode = 'user';
let runProj = '';
/** 单独试跑走 @我，从作业接着问沿用原入口。 */
const runR = (id) => {
  const t = $('r-tpl')?.value;
  if (t && cfg.templates[t]) return { ...cfg.templates[t], template: t, apis: cfg.templates[t].api ? [cfg.templates[t].api] : cfg.apis.map((a) => a.name) };
  return resolvedFor(runMode, id) || cfg[runMode].fallback;
};
/** 试跑的项目：默认是这个会话的模板指的那个，这里换只管这一次 */
function setRunProj(v) {
  runProj = v;
  $('r-projbox').replaceChildren(projPicker(v, (x) => { runProj = x; echoRun(); }, '跟模板走'));
}
function openRun(job, template) {
  runMode = job?.mode === 'bot' ? 'bot' : 'user';
  const ts = $('r-tpl');
  ts.replaceChildren(new Option('跟会话走', ''), ...Object.keys(cfg.templates).map((n) => new Option(n, n)));
  ts.value = template && cfg.templates[template] ? template : '';
  const s = $('r-chat');
  s.textContent = '';
  const none = el('option'); none.value = ''; none.textContent = '（不指定，用默认配置）';
  s.appendChild(none);
  for (const id of new Set([...Object.keys(cfg[runMode].chats), ...(job?.chatId ? [job.chatId] : [])])) { const o = el('option'); o.value = id; o.textContent = chatName(id); s.appendChild(o); }
  s.value = job?.chatId || '';
  setRunProj((job && job.project) || runR(s.value)?.project || '');
  $('r-q').value = job ? job.q : '';
  $('run-stat').textContent = '';
  $('run').hidden = false; $('scrim').hidden = false;
  echoRun();
  $('r-q').focus();
}
function closeRun() { $('run').hidden = true; $('scrim').hidden = true; }

/** 跑之前先把"这句话会被怎么处理"摆出来 —— 路由、权限、提示词来源 */
function echoRun() {
  const chatId = $('r-chat').value;
  const r = runR(chatId);
  const proj = runProj || r?.project || '';
  const e = $('r-echo');
  e.textContent = '';
  const line = (k, v, cls) => { const d = el('div'); d.append(el('b', null, k + '：'), el('span', cls, v)); return d; };
  e.append(
    line('项目', proj || '（空）', proj ? '' : 'no'),
    line('执行器', agentName(r)),
    line('权限', permLabel(r)),
    line('模型', r?.model || agentName(r) + ' 默认'),
    ...(r?.agent === 'codex' ? [line('推理强度', r.codexEffort || '跟随 Codex 设置')] : []),
    line('判定', r?.judge ? '先判定要不要回' : '直接回'),
    line('提示词', r?.prompt ? `模板「${r.template}」自己那段` : `模板「${r?.template || '?'}」没设（不加系统提示词）`),
  );
  if ($('r-tpl').value) e.appendChild(el('div', 'note', '这次用模板「' + $('r-tpl').value + '」（保存过的那份），不改会话绑定。'));
  else if (!chatId) e.appendChild(el('div', 'note', '没指定会话：用默认模板。上面换的项目只管这一次，不改模板。'));
  else if (!onIn(runMode, chatId)) e.appendChild(el('div', 'note', '这个会话没开自动回 —— 试跑照样能跑，但真消息不会触发。'));
}
$('btn-run').onclick = () => openRun();
$('run-close').onclick = closeRun;
const runRefresh = () => { setRunProj(runR($('r-chat').value)?.project || ''); echoRun(); };
$('r-chat').addEventListener('change', runRefresh);
$('r-tpl').addEventListener('change', runRefresh);
$('run-go').onclick = async () => {
  const body = {
    mode: runMode, chatId: $('r-chat').value, project: runProj, template: $('r-tpl').value || undefined,
    prompt: $('r-q').value.trim(),
  };
  if (!body.prompt) { $('run-stat').textContent = '先写一句要问的话'; return; }
  $('run-go').disabled = true; $('run-stat').textContent = '启动中…';
  const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  $('run-go').disabled = false;
  if (!r.ok) { $('run-stat').textContent = d.error || '起不来'; return; }
  // 从设置里点的试跑：回主界面看进度（「试跑」按钮只在都保存了的时候能点，这里不会丢改动）
  if (draft) await closeSettings();
  grp = body.chatId || grp; sel = d.id; closeRun(); renderAll();
};

$('run-judge').onclick = async () => {
  const body = { mode: runMode, chatId: $('r-chat').value, template: $('r-tpl').value || undefined, prompt: $('r-q').value.trim(), p2p: isP2P($('r-chat').value) };
  if (!body.prompt) { $('run-stat').textContent = '先写一句要问的话'; return; }
  $('run-judge').disabled = true; $('run-stat').textContent = '判定中…';
  const r = await fetch('/api/judge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  $('run-judge').disabled = false;
  $('run-stat').textContent = !r.ok ? (d.error || '判定失败') : d.none ? '这个会话的模板没开「先判定」—— 会直接交给所选执行器' : `${d.label}：${d.reason}`;
};

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;   // 确认框自己管 Esc / 回车
  if (e.key === 'Escape') { if (!$('run').hidden) closeRun(); else if (!$('settings').hidden) closeSettings(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 's' && draft) { e.preventDefault(); if (!$('set-save').disabled) $('set-save').click(); return; }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); $('gsearch').focus(); }
});
$('gsearch').addEventListener('input', () => { gq = $('gsearch').value.trim().toLowerCase(); renderGroups(); });

/* ---------- 左栏筛选 ---------- */
function renderGFilters() {
  $('f-hasjobs').setAttribute('aria-pressed', String(gHasJobs));
  const seg = $('gkind');
  seg.textContent = '';
  for (const [k, label] of [['all', '全部'], ['group', '群'], ['p2p', '私聊']]) {
    const b = el('button', null, label);
    b.setAttribute('aria-pressed', String(gKind === k));
    b.onclick = () => { gKind = k; renderGFilters(); renderGroups(); };
    seg.appendChild(b);
  }
}
$('f-hasjobs').onclick = () => {
  gHasJobs = !gHasJobs;
  try { localStorage.setItem('lcr.hasJobs', gHasJobs ? '1' : ''); } catch (e) {}
  renderGFilters(); renderGroups();
};

/* ---------- 三栏拖宽 ---------- */
// 宽度只是这台机器上的偏好，存 localStorage（读写都可能抛：隐私模式、禁了站点数据）
const COLS = { rail: { min: 176, max: 384 }, mid: { min: 208, max: 512 } };   // px；另有 CSS 里的占窗宽上限
let colW = {};
try { colW = JSON.parse(localStorage.getItem('lcr.cols')) || {}; } catch (e) {}
function setCol(k, px) {
  if (px == null) delete colW[k];
  else colW[k] = Math.round(Math.min(Math.max(px, COLS[k].min), COLS[k].max));
  paintCols();
  try { localStorage.setItem('lcr.cols', JSON.stringify(colW)); } catch (e) {}
}
function paintCols() {
  for (const k in COLS) {
    if (colW[k]) $('stage').style.setProperty('--w-' + k, colW[k] + 'px'); else $('stage').style.removeProperty('--w-' + k);
    const g = document.querySelector(`.stage-grip[data-col=${k}]`);
    g.setAttribute('aria-valuemin', COLS[k].min); g.setAttribute('aria-valuemax', COLS[k].max);
    g.setAttribute('aria-valuenow', Math.round(document.querySelector('.col.' + k).getBoundingClientRect().width));
  }
}
for (const g of document.querySelectorAll('.stage-grip')) {
  const k = g.dataset.col;
  const width = () => document.querySelector('.col.' + k).getBoundingClientRect().width;
  g.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    g.classList.add('stage-grip-on'); $('stage').classList.add('stage-drag');
    const x0 = e.clientX, w0 = width();
    g.onpointermove = (ev) => setCol(k, w0 + ev.clientX - x0);
    g.onpointerup = g.onpointercancel = () => {
      g.onpointermove = g.onpointerup = g.onpointercancel = null;
      g.classList.remove('stage-grip-on'); $('stage').classList.remove('stage-drag');
    };
  };
  g.ondblclick = () => setCol(k, null);
  // 键盘：← → 一次 16px，按住 Shift 一次 48px；Home 恢复默认
  g.onkeydown = (e) => {
    const d = { ArrowLeft: -16, ArrowRight: 16 }[e.key];
    if (d) { e.preventDefault(); setCol(k, width() + d * (e.shiftKey ? 3 : 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setCol(k, null); }
  };
}
paintCols();
addEventListener('resize', paintCols);   // 窗口一缩，CSS 的占窗宽上限可能生效，读屏报的宽度跟着更新
</script>
</body>
</html>
